<style>
:root{
  --bg:#0B1220; --panel:#141E30; --panel2:#1B2740; --panel3:#22314C;
  --line:#26344F; --line2:#33456A;
  --tx:#E7ECF5; --dim:#8FA0BC; --dim2:#64769A;
  --amber:#FFB020; --amber-d:#3A2A0C;
  --delft:#5B8DEF; --delft-d:#152647;
  --mint:#34D399; --mint-d:#0E2E27;
  --coral:#FF6B6B; --coral-d:#33161B;
  --mono:ui-monospace,"SF Mono",Menlo,monospace;
  --sans:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",system-ui,sans-serif;
  --r:14px; --pad:16px;
  --sat:env(safe-area-inset-top); --sab:env(safe-area-inset-bottom);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%}
body{
  background:var(--bg); color:var(--tx); font-family:var(--sans);
  font-size:16px; line-height:1.45; overscroll-behavior:none;
  -webkit-font-smoothing:antialiased;
  background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);
  background-size:44px 44px; background-position:-1px -1px;
}
body::before{content:"";position:fixed;inset:0;background:radial-gradient(120% 70% at 50% 0%,rgba(11,18,32,.55),var(--bg) 70%);pointer-events:none;z-index:0}
/* #run/#sheet are fixed overlays and are styled at the very end of this sheet.
   Never add them to this in-flow reset — it collapses the runner (see b7 bug). */
#app,#gate{position:relative;z-index:1}
button{font-family:inherit;font-size:inherit;color:inherit;background:none;border:none;padding:0;cursor:pointer}
input{font-family:inherit;font-size:16px}
::-webkit-scrollbar{display:none}

/* ---------- type ---------- */
.eyebrow{font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim2)}
.h1{font-size:26px;font-weight:800;letter-spacing:-.02em;line-height:1.15;margin:0}
.h2{font-size:19px;font-weight:700;letter-spacing:-.01em;margin:0}
.h3{font-size:15px;font-weight:650;margin:0}
.sm{font-size:13.5px;color:var(--dim)}
.xs{font-size:12px;color:var(--dim2)}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.nl{color:var(--amber)}

/* ---------- layout ---------- */
#app{display:none;flex-direction:column;height:100%}
header#hdr{
  padding:calc(var(--sat) + 10px) var(--pad) 10px; display:flex;align-items:center;gap:10px;
  border-bottom:1px solid var(--line); background:rgba(11,18,32,.9); backdrop-filter:blur(12px);
  position:sticky;top:0;z-index:20
}
main#view{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:var(--pad) var(--pad) 90px}
nav#tabs{
  position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;
  padding:6px 4px calc(var(--sab) + 6px); gap:2px;
  background:rgba(15,23,40,.92); backdrop-filter:blur(16px); border-top:1px solid var(--line)
}
nav#tabs button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 2px;border-radius:10px;color:var(--dim2)}
nav#tabs button .ti{font-size:19px;line-height:1}
nav#tabs button .tl{font-family:var(--mono);font-size:9.5px;letter-spacing:.06em;text-transform:uppercase}
nav#tabs button.on{color:var(--amber)}

/* ---------- cards ---------- */
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:var(--pad);margin-bottom:12px}
.card.tap:active{background:var(--panel2)}
.row{display:flex;align-items:center;gap:12px}
.between{display:flex;align-items:center;justify-content:space-between;gap:10px}
.stack{display:flex;flex-direction:column;gap:2px;min-width:0}
.grow{flex:1;min-width:0}
.trunc{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sec{margin:22px 0 10px;display:flex;align-items:baseline;justify-content:space-between}
hr.d{border:0;border-top:1px solid var(--line);margin:14px 0}

/* ---------- chips / badges ---------- */
.chip{font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;
  padding:4px 8px;border-radius:6px;background:var(--panel2);color:var(--dim);border:1px solid var(--line);white-space:nowrap}
.chip.amber{background:var(--amber-d);color:var(--amber);border-color:#4d3a12}
.chip.delft{background:var(--delft-d);color:var(--delft);border-color:#26406e}
.chip.mint{background:var(--mint-d);color:var(--mint);border-color:#14493c}
.lv{font-family:var(--mono);font-weight:700;font-size:11px;letter-spacing:.06em;padding:3px 7px;border-radius:5px;background:var(--panel2);color:var(--dim)}
.lv.A1{background:#12304a;color:#7ec8ff}.lv.A2{background:#123a3a;color:#5fdcc4}
.lv.B1{background:#3a3212;color:#ffd166}.lv.B2{background:#3a1a2e;color:#ff9ecb}

/* ---------- buttons ---------- */
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;
  padding:15px;border-radius:12px;background:var(--amber);color:#1A1206;font-weight:750;font-size:16px;letter-spacing:-.01em}
.btn:active{transform:scale(.985);filter:brightness(.94)}
.btn.ghost{background:var(--panel2);color:var(--tx);border:1px solid var(--line2);font-weight:600}
.btn.line{background:none;border:1px solid var(--line2);color:var(--dim);font-weight:600}
.btn.sm{padding:10px 14px;font-size:14px;width:auto}
.btn.danger{background:var(--coral-d);color:var(--coral);border:1px solid #5a2730}
.icob{width:38px;height:38px;border-radius:10px;background:var(--panel2);border:1px solid var(--line);
  display:flex;align-items:center;justify-content:center;font-size:16px;flex:none}
.icob:active{background:var(--panel3)}

/* ---------- progress ---------- */
.bar{height:6px;border-radius:3px;background:var(--panel3);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--amber);border-radius:3px;transition:width .4s ease}
.bar.thin{height:4px}
.bar>i.mint{background:var(--mint)}.bar>i.delft{background:var(--delft)}
.ring{position:relative;width:44px;height:44px;flex:none}
.ring svg{transform:rotate(-90deg)}
.ring b{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  font-family:var(--mono);font-size:11px;font-weight:700;color:var(--dim)}

/* ---------- today hero ---------- */
.hero{background:linear-gradient(160deg,#182643,#111B2E 60%);border:1px solid var(--line2);position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-40px;top:-40px;width:160px;height:160px;
  background:radial-gradient(circle,rgba(255,176,32,.16),transparent 65%);pointer-events:none}
.plan{display:flex;gap:6px;flex-wrap:wrap;margin:14px 0 16px}
.pw{display:flex;align-items:center;gap:6px;font-family:var(--mono);font-size:11px;color:var(--dim);
  background:rgba(0,0,0,.25);border:1px solid var(--line);border-radius:7px;padding:5px 8px}
.pw b{color:var(--tx);font-size:12px}

/* ---------- pace curve ---------- */
.curve{width:100%;height:96px;display:block}
.curve .grid{stroke:var(--line);stroke-width:1}
.curve .target{stroke:var(--dim2);stroke-width:1.5;stroke-dasharray:3 4;fill:none}
.curve .act{stroke:var(--amber);stroke-width:2.5;fill:none;stroke-linejoin:round;stroke-linecap:round}
.curve .fill{fill:url(#pg)}
.curve text{font-family:var(--mono);font-size:9px;fill:var(--dim2)}

/* ---------- exercise runner ---------- */
#run{display:none;position:fixed;inset:0;z-index:60;background:var(--bg);flex-direction:column}
#run .top{padding:calc(var(--sat) + 10px) var(--pad) 10px;display:flex;align-items:center;gap:12px}
#run .body{flex:1;overflow-y:auto;padding:8px var(--pad) 24px;display:flex;flex-direction:column}
#run .foot{padding:12px var(--pad) calc(var(--sab) + 12px);border-top:1px solid var(--line);background:var(--panel)}

.prompt{text-align:center;padding:18px 0 6px}
.prompt .big{font-size:36px;font-weight:800;letter-spacing:-.03em;line-height:1.1;color:var(--amber)}
.prompt .big.en{color:var(--tx);font-size:30px}
.prompt .art{font-size:15px;color:var(--dim);font-weight:600;margin-right:6px;-webkit-text-fill-color:var(--dim)}
.prompt .sub{font-size:14px;color:var(--dim);margin-top:8px}
.emoji-xl{font-size:64px;line-height:1;margin-bottom:6px}

.opts{display:flex;flex-direction:column;gap:9px;margin-top:18px}
.opt{display:flex;align-items:center;gap:12px;padding:14px;border-radius:12px;
  background:var(--panel);border:1px solid var(--line);text-align:left;transition:.12s}
.opt:active{background:var(--panel2)}
.opt .oe{font-size:28px;flex:none;width:38px;text-align:center}
.opt .ot{flex:1;font-size:16px;font-weight:600;line-height:1.3}
.opt.ok{background:var(--mint-d);border-color:var(--mint);color:#c9f7e6}
.opt.no{background:var(--coral-d);border-color:var(--coral);color:#ffd4d4}
.opt.dim{opacity:.4}
.opts.grid2{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.opts.grid2 .opt{flex-direction:column;align-items:center;text-align:center;padding:16px 10px;gap:8px}
.opts.grid2 .opt .oe{font-size:42px;width:auto}
.opts.grid2 .opt .ot{font-size:14px;flex:none}

.cloze{font-size:21px;line-height:1.6;text-align:center;font-weight:600;padding:10px 0}
.cloze u{color:var(--amber);text-decoration:none;border-bottom:2px dashed var(--line2);padding:0 22px}

.typebox{width:100%;padding:16px;border-radius:12px;background:var(--panel);border:1.5px solid var(--line2);
  color:var(--tx);font-size:22px;font-weight:700;text-align:center;letter-spacing:-.01em;outline:none}
.typebox:focus{border-color:var(--amber)}
.typebox.ok{border-color:var(--mint)}.typebox.no{border-color:var(--coral)}

.reveal{margin-top:16px;padding:14px;border-radius:12px;background:var(--panel2);border:1px solid var(--line)}
.reveal .rw{font-size:20px;font-weight:750;color:var(--amber);margin-bottom:2px}
.reveal .rm{font-size:15px;color:var(--tx);margin-bottom:10px}
.reveal .rs{font-size:15px;color:var(--tx);font-weight:600;line-height:1.4}
.reveal .rt{font-size:13.5px;color:var(--dim);margin-top:3px}
.reveal .hint{font-size:13px;color:var(--delft);margin-top:9px}
.fb{display:flex;align-items:center;gap:8px;font-weight:750;font-size:15px;margin-bottom:10px}
.fb.ok{color:var(--mint)}.fb.no{color:var(--coral)}

/* ---------- lists ---------- */
.lrow{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.lrow:last-child{border-bottom:0}
.lrow .le{font-size:24px;width:30px;text-align:center;flex:none}
.uni{display:flex;align-items:center;gap:12px;padding:13px 14px;background:var(--panel);
  border:1px solid var(--line);border-radius:12px;margin-bottom:8px;width:100%;text-align:left}
.uni:active{background:var(--panel2)}
.uni .ui{font-size:22px;width:30px;text-align:center;flex:none}

/* ---------- sheet ---------- */
#sheet{position:fixed;inset:0;z-index:70;display:none;align-items:flex-end;background:rgba(5,9,16,.66);backdrop-filter:blur(3px)}
#sheet .in{width:100%;max-height:88%;overflow-y:auto;background:var(--panel);border-radius:20px 20px 0 0;
  border-top:1px solid var(--line2);padding:8px var(--pad) calc(var(--sab) + 20px);animation:up .22s ease}
@keyframes up{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}
.grab{width:36px;height:4px;border-radius:2px;background:var(--line2);margin:6px auto 14px}

/* ---------- gate ---------- */
#gate{display:flex;flex-direction:column;justify-content:center;min-height:100%;padding:32px 24px calc(var(--sab) + 32px)}
.who{display:flex;align-items:center;gap:14px;padding:16px;border-radius:14px;background:var(--panel);
  border:1px solid var(--line);width:100%;margin-bottom:10px;text-align:left}
.who:active{background:var(--panel2)}
.av{width:44px;height:44px;border-radius:12px;background:var(--panel3);display:flex;align-items:center;
  justify-content:center;font-weight:800;font-size:17px;color:var(--amber);flex:none}
.pin{display:flex;gap:10px;justify-content:center;margin:18px 0}
.pd{width:14px;height:14px;border-radius:50%;border:1.5px solid var(--line2)}
.pd.f{background:var(--amber);border-color:var(--amber)}
.keys{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:300px;margin:0 auto}
.keys button{padding:16px;border-radius:12px;background:var(--panel);border:1px solid var(--line);
  font-family:var(--mono);font-size:21px;font-weight:600}
.keys button:active{background:var(--panel2)}

/* ---------- misc ---------- */
.mic{width:96px;height:96px;border-radius:50%;background:var(--panel2);border:2px solid var(--line2);
  display:flex;align-items:center;justify-content:center;font-size:36px;margin:0 auto}
.mic.rec{background:var(--coral-d);border-color:var(--coral);animation:pulse 1.3s infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(255,107,107,.4)}50%{box-shadow:0 0 0 16px rgba(255,107,107,0)}}
.score{font-family:var(--mono);font-size:38px;font-weight:700;text-align:center}
.wave{display:flex;gap:3px;justify-content:center;align-items:flex-end;height:26px;margin:10px 0}
.wave i{width:3px;background:var(--delft);border-radius:2px;animation:w 1s infinite ease-in-out}
@keyframes w{0%,100%{height:6px}50%{height:24px}}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal i{aspect-ratio:1;border-radius:4px;background:var(--panel2)}
.cal i.d1{background:#3a2c10}.cal i.d2{background:#6b4d14}.cal i.d3{background:var(--amber)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--sab) + 78px);z-index:90;
  background:var(--panel3);border:1px solid var(--line2);padding:11px 16px;border-radius:12px;
  font-size:14px;font-weight:600;box-shadow:0 8px 24px rgba(0,0,0,.5);animation:up .2s}
.empty{text-align:center;padding:40px 20px;color:var(--dim2)}
.empty .e{font-size:40px;margin-bottom:10px}
.note{background:var(--delft-d);border:1px solid #26406e;border-radius:10px;padding:11px 13px;font-size:13.5px;color:#bcd4ff}
.warn{background:var(--amber-d);border:1px solid #4d3a12;border-radius:10px;padding:11px 13px;font-size:13.5px;color:#ffd98a}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* roadmap */
.rstop{position:absolute;width:50px;height:50px;border-radius:50%;background:var(--panel2);border:2px solid var(--line2);display:flex;align-items:center;justify-content:center;z-index:2}
.rstop .ri{font-size:22px}
.rstop.done{border-color:var(--amber);background:var(--amber-d)}
.rstop.act{border-color:var(--amber);box-shadow:0 0 0 0 rgba(255,176,32,.4);animation:rglow 2s ease-out infinite}
.rstop.todo{opacity:.55;filter:grayscale(.4)}
@keyframes rglow{0%{box-shadow:0 0 0 0 rgba(255,176,32,.4)}100%{box-shadow:0 0 0 14px rgba(255,176,32,0)}}
.rok{position:absolute;right:-3px;bottom:-3px;width:18px;height:18px;border-radius:50%;background:var(--mint);color:#06281c;font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center}
.rme{position:absolute;right:-5px;top:-5px;width:20px;height:20px;border-radius:7px;background:var(--amber);color:#2b1c00;font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center}
.rpct{position:absolute;width:50px;text-align:center;font-size:9px;color:var(--dim)}
.rflag{position:absolute;left:10px;font-family:var(--mono);font-size:11px;font-weight:800;z-index:2}
/* conversation */
.cvstage{display:flex;justify-content:center;gap:14px;font-size:40px;padding:14px 0 6px;filter:drop-shadow(0 6px 18px rgba(0,0,0,.45))}
.cvstage span{animation:bob 3s ease-in-out infinite}
.cvstage span:nth-child(2){animation-delay:.4s}
.cvstage span:nth-child(3){animation-delay:.8s}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
.chip.sp-amber{color:var(--amber);border-color:var(--amber)}
.chip.sp-delft{color:var(--delft);border-color:var(--delft)}
.chip.sp-mint{color:var(--mint);border-color:var(--mint)}
.cvline{display:block;width:100%;text-align:left;background:var(--panel);border:1px solid var(--line);border-left-width:3px;border-radius:12px;padding:10px 12px;margin-bottom:8px;transition:.25s;opacity:.55}
.cvline .cvwho{display:block;font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;margin-bottom:3px}
.cvline .cvnl{display:block;font-size:16px;font-weight:650;line-height:1.35}
.cvline .cven{display:block;font-size:12.5px;color:var(--dim);margin-top:3px}
.cvline.sp-amber{border-left-color:var(--amber)}.cvline.sp-amber .cvwho{color:var(--amber)}
.cvline.sp-delft{border-left-color:var(--delft)}.cvline.sp-delft .cvwho{color:var(--delft)}
.cvline.sp-mint{border-left-color:var(--mint)}.cvline.sp-mint .cvwho{color:var(--mint)}
.cvline.seen{opacity:.8}
.cvline.on{opacity:1;transform:scale(1.015)}
.cvline.on.sp-amber{background:rgba(255,176,32,.10);box-shadow:0 6px 22px rgba(0,0,0,.3)}
.cvline.on.sp-delft{background:rgba(91,141,239,.12);box-shadow:0 6px 22px rgba(0,0,0,.3)}
.cvline.on.sp-mint{background:rgba(52,211,153,.10);box-shadow:0 6px 22px rgba(0,0,0,.3)}


.wtile{width:96px;height:96px;margin:6px auto;border-radius:24px;background:linear-gradient(145deg,var(--panel2),var(--panel));border:1px solid var(--line2);display:flex;align-items:center;justify-content:center;position:relative}
.wtile span{font-size:44px;font-weight:800;color:var(--amber);font-family:var(--mono)}
.wtile em{position:absolute;right:8px;bottom:6px;font-style:normal;font-size:18px;opacity:.8}


/* energy pack */
body::after{content:"";position:fixed;inset:-20%;pointer-events:none;z-index:0;
 background:radial-gradient(38% 28% at 18% 12%,rgba(255,176,32,.10),transparent 60%),
            radial-gradient(34% 26% at 85% 20%,rgba(91,141,239,.12),transparent 60%),
            radial-gradient(40% 30% at 60% 95%,rgba(52,211,153,.08),transparent 60%);
 animation:aurora 16s ease-in-out infinite alternate}
@keyframes aurora{0%{transform:translate3d(-2%,-1%,0) scale(1)}100%{transform:translate3d(2%,2%,0) scale(1.06)}}
/* NB: #run must NOT be in this list — it is a fixed full-screen overlay, not
   in-flow content. Re-adding it here reintroduces the dead-session bug. */
#app,#gate{position:relative;z-index:1}
.card.hero{background:linear-gradient(160deg,rgba(255,176,32,.14),var(--panel) 42%),var(--panel);border-color:rgba(255,176,32,.35);box-shadow:0 12px 40px rgba(255,176,32,.07)}
.btn{box-shadow:0 6px 22px rgba(255,176,32,.28)}
.wtile{background:linear-gradient(150deg,rgba(255,176,32,.16),var(--panel2) 60%)}
.streak{animation:flick 1.6s ease-in-out infinite}
@keyframes flick{0%,100%{transform:scale(1)}50%{transform:scale(1.12) rotate(-3deg)}}
.rstop.act .ri{animation:hop 1.8s ease-in-out infinite}
@keyframes hop{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
/* confetti */
.confetti{position:fixed;inset:0;pointer-events:none;z-index:99;overflow:hidden}
.confetti i{position:absolute;top:-4vh;width:9px;height:14px;border-radius:2px;animation:fall 2.6s ease-in forwards}
@keyframes fall{0%{transform:translateY(0) rotate(0)}100%{transform:translateY(110vh) rotate(720deg);opacity:.9}}
.scorering{width:130px;height:130px;border-radius:50%;margin:8px auto 4px;display:flex;align-items:center;justify-content:center;
 background:conic-gradient(var(--mint) calc(var(--p)*1%),var(--panel2) 0);position:relative}
.scorering::before{content:"";position:absolute;inset:9px;border-radius:50%;background:var(--panel)}
.scorering b{position:relative;font-family:var(--mono);font-size:26px}
/* conversation bubbles */
.cvrow{display:flex;gap:8px;margin-bottom:10px;align-items:flex-end}
.cvrow.right{flex-direction:row-reverse}
.cvav{width:30px;height:30px;border-radius:50%;flex:0 0 30px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;border:1.5px solid var(--line2)}
.cvav.sp-amber{color:var(--amber);border-color:var(--amber)}.cvav.sp-delft{color:var(--delft);border-color:var(--delft)}.cvav.sp-mint{color:var(--mint);border-color:var(--mint)}
.cvrow .cvline{max-width:84%;margin-bottom:0;border-radius:16px}
.cvrow.left .cvline{border-bottom-left-radius:5px}
.cvrow.right .cvline{border-bottom-right-radius:5px;text-align:left}

/* ---------- OVERLAY STACKING · KEEP THIS LAST IN THE STYLESHEET ----------
   The runner (#run) and the sheet (#sheet) are full-screen fixed overlays.
   Build b7 listed #run in the in-flow reset rule (position:relative;z-index:1)
   further down the sheet; equal specificity meant the later rule won, #run
   collapsed into an in-flow block below the fold, and because startSession()
   also sets body{overflow:hidden} the page could not even be scrolled to it.
   Every lesson looked like it simply refused to start. These declarations are
   the last word so that a stray rule above can never do that again. */
#run{position:fixed;top:0;right:0;bottom:0;left:0;z-index:60;flex-direction:column}
#sheet{position:fixed;top:0;right:0;bottom:0;left:0;z-index:70}
</style>

const GRAMMAR = [
{id:"g01", mem:"When in doubt: say 'de'. Two of every three Dutch nouns take de — and every plural does, always.",lv:"A1",t:"de, het, een",
 why:"Every Dutch noun is a de-word or a het-word. Getting this wrong is the single most common mistake, so learn the article with the noun from day one.",
 r:["Roughly 75% of nouns are de-words. All plurals are de.",
    "het is used for most diminutives (-je), most words for languages, metals, and many one-syllable neuter nouns.",
    "een = a/an, never changes.",
    "In this app the article is shown with the word. Say it out loud together: 'de tafel', not 'tafel'."],
 ex:[["De tafel is groot.","The table is big."],["Het huis is nieuw.","The house is new."],["Ik heb een fiets.","I have a bike."]],
 d:[{q:"___ meisje speelt buiten.",o:["Het","De"],a:0,h:"-je diminutive → always het"},
    {q:"___ tafels zijn schoon.",o:["De","Het"],a:0,h:"all plurals take de"},
    {q:"Ik koop ___ brood.",o:["een","de"],a:0,h:"one loaf, not a specific one"}]},

{id:"g02", mem:"jij and hij steal the -t from each other: 'jij werkt' but 'werk jij?' — flip the order, drop the t.",lv:"A1",t:"Present tense: ik / jij / hij",
 why:"Dutch present tense is only three forms. Learn the pattern once and it covers 90% of verbs.",
 r:["ik + stem (werk)","jij/u/hij/zij/het + stem + t (werkt)","wij/jullie/zij + infinitive (werken)",
    "Stem = infinitive minus -en, then fix spelling: werken→werk, maken→maak, leven→leef, reizen→reis."],
 ex:[["Ik werk in de energiesector.","I work in the energy sector."],["Hij werkt vandaag thuis.","He works from home today."],["Wij werken samen.","We work together."]],
 d:[{q:"Hij ___ elke dag naar kantoor. (fietsen)",o:["fietst","fiets","fietsen"],a:0,h:"hij → stem + t"},
    {q:"Ik ___ Nederlands. (leren)",o:["leer","leert","leren"],a:0,h:"ik → bare stem"},
    {q:"Wij ___ om zeven uur. (eten)",o:["eten","eet","eett"],a:0,h:"wij → infinitive"}]},

{id:"g03", mem:"The verb is glued to seat number 2. Whatever you put first — time, place, anything — the verb never moves from seat 2.",lv:"A1",t:"Verb second: the V2 rule",
 why:"This is the backbone of Dutch. The conjugated verb is always in position two of a main clause — no matter what comes first.",
 r:["Normal: Ik ga morgen naar Amsterdam.",
    "Start with something else and the subject jumps behind the verb: Morgen ga ik naar Amsterdam.",
    "'Position two' counts blocks, not words: 'Volgende week maandag ga ik…'",
    "This inversion is not optional. Getting it right instantly makes you sound Dutch."],
 ex:[["Ik drink 's ochtends koffie.","I drink coffee in the morning."],["'s Ochtends drink ik koffie.","In the morning I drink coffee."],["Vandaag werkt zij thuis.","Today she works from home."]],
 d:[{q:"Morgen ___ naar de dokter.",o:["ga ik","ik ga"],a:0,h:"time first → verb, then subject"},
    {q:"___ ik een e-mail gestuurd.",o:["Gisteren heb","Gisteren ik heb"],a:0,h:"verb must be second"},
    {q:"In Nederland ___ veel mensen.",o:["fietsen","mensen fietsen"],a:0,h:"verb second, subject third"}]},

{id:"g04", mem:"'Ik ben, ik heb' — everything else bends around these two. Sing the rows once a day for a week and you own them.",lv:"A1",t:"hebben and zijn",
 why:"The two most-used verbs, both irregular, and both needed later to build the perfect tense.",
 r:["hebben: ik heb, jij hebt, hij heeft, wij/jullie/zij hebben",
    "zijn: ik ben, jij bent, hij is, wij/jullie/zij zijn",
    "In questions with jij, drop the -t: heb jij? ben jij?"],
 ex:[["Ik heb een vraag.","I have a question."],["Hij is ingenieur.","He is an engineer."],["Heb jij tijd?","Do you have time?"]],
 d:[{q:"___ jij morgen vrij?",o:["Ben","Bent"],a:0,h:"inverted jij loses the -t"},
    {q:"Zij ___ twee kinderen.",o:["heeft","hebt"],a:0,h:"zij (singular) → heeft"},
    {q:"Wij ___ op kantoor.",o:["zijn","is"],a:0,h:"wij → zijn"}]},

{id:"g05", mem:"Long word → -s, short word → -en. (Words ending in -el, -er, -en, -je take -s; most short ones take -en.)",lv:"A1",t:"Plurals: -en and -s",
 why:"Two endings cover almost everything; the spelling changes are predictable.",
 r:["Default: +en (boek→boeken, huis→huizen, brief→brieven — s→z, f→v between vowels)",
    "+s after -el, -em, -en, -er, -je and most vowels (tafel→tafels, meisje→meisjes)",
    "Short vowel + one consonant doubles it: man→mannen, bus→bussen",
    "Long vowel loses one letter: raam→ramen, boot→boten"],
 ex:[["twee huizen","two houses"],["drie tafels","three tables"],["vier mannen","four men"]],
 d:[{q:"één brief → twee ___",o:["brieven","briefen"],a:0,h:"f becomes v"},
    {q:"één kamer → twee ___",o:["kamers","kameren"],a:0,h:"-er → +s"},
    {q:"één zon → twee ___",o:["zonnen","zonen"],a:0,h:"short vowel doubles the consonant"}]},

{id:"g06", mem:"'ze' is the great recycler: it can be she, they, or them. Let context do the work.",lv:"A1",t:"Pronouns and possessives",
 why:"You need these in every sentence, and Dutch has stressed and unstressed forms you will hear constantly.",
 r:["Subject: ik, jij/je, u, hij, zij/ze, wij/we, jullie, zij/ze",
    "Object: mij/me, jou/je, u, hem, haar, ons, jullie, hen/ze",
    "Possessive: mijn, jouw/je, uw, zijn, haar, ons/onze, jullie, hun",
    "ons before het-words, onze before de-words: ons huis, onze auto."],
 ex:[["Kun je mij helpen?","Can you help me?"],["Dat is onze auto.","That is our car."],["Hun huis staat te koop.","Their house is for sale."]],
 d:[{q:"Dat is ___ kantoor. (van ons)",o:["ons","onze"],a:0,h:"het kantoor → ons"},
    {q:"Ik zie ___ morgen. (jij)",o:["je","jouw"],a:0,h:"object form, not possessive"},
    {q:"___ collega's werken hard. (van hen)",o:["Hun","Hen"],a:0,h:"possessive = hun"}]},

{id:"g07", mem:"geen kills 'een' and bare nouns; niet kills everything else. No article to attack? Then it's geen.",lv:"A1",t:"Negation: niet or geen",
 why:"Choosing wrong here is very audible. The rule is short and mechanical.",
 r:["geen negates an indefinite noun (een / no article): Ik heb geen auto.",
    "niet negates everything else: verbs, adjectives, definite nouns, prepositions.",
    "niet goes at the end of the clause, but before adjectives, prepositional phrases and separable prefixes.",
    "Ik ken de buurman niet. / Het is niet duur. / Ik ga niet naar huis."],
 ex:[["Ik heb geen tijd.","I have no time."],["Ik werk vandaag niet.","I am not working today."],["De prijs is niet hoog.","The price is not high."]],
 d:[{q:"Ik drink ___ koffie.",o:["geen","niet"],a:0,h:"indefinite noun"},
    {q:"Hij komt vanavond ___.",o:["niet","geen"],a:0,h:"negating the verb"},
    {q:"Dat is ___ mijn fiets.",o:["niet","geen"],a:0,h:"definite/possessive → niet"}]},

{id:"g08", mem:"A question is just a statement doing a handstand: verb first, subject second.",lv:"A1",t:"Questions",
 why:"Half of daily conversation. Two shapes only.",
 r:["Yes/no: verb first. Werk jij in Rotterdam?",
    "Open: question word + verb + subject. Waar werk jij?",
    "Question words: wie, wat, waar, wanneer, waarom, hoe, welk(e), hoeveel, hoelang",
    "With jij right after the verb, drop the -t: Waar woon jij?"],
 ex:[["Waar is het station?","Where is the station?"],["Hoeveel kost dat?","How much does that cost?"],["Kom je mee?","Are you coming along?"]],
 d:[{q:"___ begint de vergadering?",o:["Hoe laat","Wat laat"],a:0,h:"asking a time"},
    {q:"___ jij dit voorstel?",o:["Begrijp","Begrijpt"],a:0,h:"inverted jij: no -t"},
    {q:"___ ben je niet gekomen?",o:["Waarom","Wat"],a:0,h:"asking a reason"}]},

{id:"g09", mem:"Modals shoot the second verb to the end of the sentence — 'Ik kan morgen niet komen.' Kick the extra verb to the back wall.",lv:"A1",t:"Modal verbs",
 why:"kunnen, moeten, willen, mogen let you express ability, obligation, wish and permission with any verb you already know.",
 r:["kunnen (can): ik kan, jij kunt, hij kan, wij kunnen",
    "moeten (must): ik moet, jij moet, hij moet, wij moeten",
    "willen (want): ik wil, jij wilt, hij wil, wij willen",
    "mogen (may): ik mag, jij mag, hij mag, wij mogen",
    "The second verb goes to the very end as an infinitive: Ik moet morgen vroeg opstaan."],
 ex:[["Ik kan je morgen bellen.","I can call you tomorrow."],["We moeten de offerte vandaag versturen.","We must send the quote today."],["Mag ik iets vragen?","May I ask something?"]],
 d:[{q:"Ik wil dit project graag ___.",o:["afronden","afrond"],a:0,h:"second verb = infinitive at the end"},
    {q:"___ jij mij helpen?",o:["Kun","Kunt"],a:0,h:"kunnen: inverted jij → kun"},
    {q:"We moeten om acht uur ___.",o:["beginnen","beginnen we"],a:0,h:"infinitive last, nothing after it"}]},

{id:"g10", mem:"New on stage? Introduce it with 'er'. 'Er is een probleem' — er is the stagehand that brings unknown things on.",lv:"A1",t:"er is / er zijn",
 why:"The Dutch 'there is/are'. Used constantly to introduce something new.",
 r:["er is + singular, er zijn + plural",
    "Word order: Er is een probleem. / In de zaal zijn er twintig mensen.",
    "Question: Is er nog koffie?",
    "Negative: Er is geen stroom."],
 ex:[["Er is een storing op het net.","There is a fault on the grid."],["Er zijn twee opties.","There are two options."],["Is er iemand?","Is anyone there?"]],
 d:[{q:"___ drie vergaderingen vandaag.",o:["Er zijn","Er is"],a:0,h:"plural"},
    {q:"___ nog een vraag?",o:["Is er","Er is"],a:0,h:"question → verb first"},
    {q:"Er ___ geen tijd meer.",o:["is","zijn"],a:0,h:"tijd is singular"}]},

{id:"g11", mem:"Spoken Dutch lives in the perfect: hebben/zijn + ge-...-d/t at the end. The participle always sits at the very end, like a full stop.",lv:"A2",t:"Perfect tense: the everyday past",
 why:"Dutch speakers use the perfect for almost all spoken past. Master this and you can talk about yesterday.",
 r:["hebben/zijn + past participle at the end of the clause.",
    "Regular participle: ge + stem + d/t. Use t after the consonants in 'soft ketchup' (t,k,f,s,ch,p), otherwise d.",
    "gewerkt, gemaakt, gehoord, gebeld",
    "Verbs starting with be-, ge-, ver-, ont-, her-, er- take no ge-: betaald, verkocht, ontmoet."],
 ex:[["Ik heb gisteren hard gewerkt.","I worked hard yesterday."],["We hebben de offerte verstuurd.","We sent the quote."],["Heb je hem gebeld?","Did you call him?"]],
 d:[{q:"Ik heb de mail ___. (versturen)",o:["verstuurd","geverstuurd"],a:0,h:"ver- prefix → no ge-"},
    {q:"Zij heeft de deur ___. (openen)",o:["geopend","geopent"],a:0,h:"stem ends in n → d"},
    {q:"We hebben lang ___. (wachten)",o:["gewacht","gewachtd"],a:0,h:"stem already ends in t"}]},

{id:"g12", mem:"Movement and change travel with zijn: gegaan, gekomen, geworden, gebleven. Everything else rides with hebben.",lv:"A2",t:"hebben or zijn in the perfect",
 why:"Pick the wrong auxiliary and the sentence sounds broken. The rule is about movement and change.",
 r:["zijn with verbs of movement to a destination: gaan, komen, vertrekken, aankomen, reizen (with a direction)",
    "zijn with change of state: worden, blijven, beginnen, stoppen, gebeuren, opstaan, vallen",
    "zijn always: zijn (geweest), blijven (gebleven)",
    "Everything else uses hebben. Movement without a destination also takes hebben: Ik heb gefietst. vs Ik ben naar huis gefietst."],
 ex:[["Ik ben naar Utrecht gegaan.","I went to Utrecht."],["Hij is ingenieur geworden.","He became an engineer."],["We hebben twee uur gefietst.","We cycled for two hours."]],
 d:[{q:"Ik ___ gisteren thuisgebleven.",o:["ben","heb"],a:0,h:"blijven always takes zijn"},
    {q:"Zij ___ het rapport geschreven.",o:["heeft","is"],a:0,h:"no movement or change of state"},
    {q:"De trein ___ te laat aangekomen.",o:["is","heeft"],a:0,h:"arriving = movement to a destination"}]},

{id:"g13", mem:"The stubborn twenty: kopen→gekocht, brengen→gebracht, denken→gedacht, zoeken→gezocht all rhyme — learn them as a chant.",lv:"A2",t:"Irregular past participles",
 why:"The 60 or so strong verbs are the most frequent verbs in the language, so these are worth memorising as a block.",
 r:["Pattern ge-…-en with a vowel change: schrijven→geschreven, rijden→gereden, blijven→gebleven",
    "Common ones: zijn→geweest, hebben→gehad, gaan→gegaan, doen→gedaan, zien→gezien, komen→gekomen, nemen→genomen, krijgen→gekregen, brengen→gebracht, denken→gedacht, kopen→gekocht, zeggen→gezegd, weten→geweten, lezen→gelezen, spreken→gesproken, drinken→gedronken, eten→gegeten",
    "Learn them in the fixed chain: infinitive – past – participle (schrijven, schreef, geschreven)."],
 ex:[["Ik heb het rapport gelezen.","I have read the report."],["Wat heb je gezegd?","What did you say?"],["Hij is nooit in Nederland geweest.","He has never been to the Netherlands."]],
 d:[{q:"Ik heb een nieuwe laptop ___. (kopen)",o:["gekocht","gekoopt"],a:0,h:"irregular: kopen, kocht, gekocht"},
    {q:"We hebben erover ___. (denken)",o:["gedacht","gedenkt"],a:0,h:"denken, dacht, gedacht"},
    {q:"Ze heeft de offerte ___. (zien)",o:["gezien","geziend"],a:0,h:"zien, zag, gezien"}]},

{id:"g14", mem:"Separable verbs are boomerangs: the prefix flies to the end of the sentence ('Ik sta om zes uur op') and snaps back in the subclause.",lv:"A2",t:"Separable verbs",
 why:"Dutch splits verbs like opstaan and meenemen in half. If you do not expect it, you will lose the meaning of the sentence.",
 r:["In a main clause the prefix flies to the end: Ik sta om zeven uur op.",
    "In the perfect, ge- sits between prefix and stem: opgestaan, meegenomen, aangekomen.",
    "With a modal, the verb stays whole at the end: Ik moet vroeg opstaan.",
    "In a subclause the verb stays whole too: …omdat ik vroeg opsta."],
 ex:[["Ik neem mijn laptop mee.","I am bringing my laptop."],["We zijn om negen uur aangekomen.","We arrived at nine."],["Kun je de vergadering voorbereiden?","Can you prepare the meeting?"]],
 d:[{q:"Ik bel je morgen ___. (opbellen)",o:["op","opbellen"],a:0,h:"prefix goes to the end"},
    {q:"Hij heeft de deur ___. (dichtdoen)",o:["dichtgedaan","gedichtdaan"],a:0,h:"ge- sits inside"},
    {q:"Ik wil je graag ___. (uitnodigen)",o:["uitnodigen","uit nodigen"],a:0,h:"after a modal the verb stays whole"}]},

{id:"g15", mem:"TMP: Tijd, Manier, Plaats — 'Ik ga morgen met de trein naar Utrecht.' When-how-where, always in that order.",lv:"A2",t:"Word order: time, manner, place",
 why:"Dutch has a fixed order for the middle of the sentence. Following it removes a lot of foreign-sounding output.",
 r:["Time – Manner – Place: Ik ga morgen met de trein naar Den Haag.",
    "English does the opposite (place last is fine, but time last is the English habit).",
    "Indirect object before direct object when both are nouns: Ik geef mijn collega het rapport.",
    "Pronoun objects move forward: Ik geef het hem."],
 ex:[["Ik werk vandaag rustig thuis.","I am working quietly at home today."],["Zij reist elke week met de auto naar Duitsland.","She travels to Germany by car every week."]],
 d:[{q:"Ik ga ___.",o:["morgen met de fiets naar kantoor","naar kantoor met de fiets morgen"],a:0,h:"time, manner, place"},
    {q:"We hebben ___ vergaderd.",o:["gisteren online","online gisteren"],a:0,h:"time before manner"},
    {q:"Hij komt ___ aan.",o:["om acht uur op het station","op het station om acht uur"],a:0,h:"time before place"}]},

{id:"g16", mem:"omdat, als, dat are verb magnets: they drag every verb to the end of their clause.",lv:"A2",t:"Subclauses: the verb goes to the end",
 why:"After omdat, dat, als, terwijl, hoewel and other subordinating conjunctions, Dutch pushes the verb all the way back. This is the second backbone rule after V2.",
 r:["Main: Ik blijf thuis. → Sub: …omdat ik thuis blijf.",
    "With two verbs, both go to the end: …omdat ik thuis moet blijven.",
    "Subordinators: omdat, dat, als, wanneer, terwijl, hoewel, zodat, voordat, nadat, of, sinds",
    "If the subclause comes first, the main clause still needs V2: Omdat het regent, blijf ik thuis."],
 ex:[["Ik kom later omdat ik een vergadering heb.","I am coming later because I have a meeting."],["Als het morgen regent, gaan we niet.","If it rains tomorrow, we are not going."],["Hij zei dat hij het rapport gestuurd heeft.","He said he sent the report."]],
 d:[{q:"Ik denk dat hij morgen ___.",o:["komt","komt morgen"],a:0,h:"verb last in the subclause"},
    {q:"Omdat ik ziek ben, ___ ik thuis.",o:["blijf","ik blijf"],a:0,h:"subclause counts as position one → verb next"},
    {q:"Ze belt als ze klaar ___.",o:["is","is klaar"],a:0,h:"verb to the very end"}]},

{id:"g17", mem:"want = comma, normal order. omdat = verb magnet. Only omdat can answer a 'waarom?' on its own.",lv:"A2",t:"want or omdat",
 why:"Both mean 'because' but they do completely different things to word order.",
 r:["want = coordinating: normal main-clause order after it. Ik blijf thuis, want het regent.",
    "omdat = subordinating: verb to the end. Ik blijf thuis omdat het regent.",
    "Same for en, maar, of, dus (no change) versus dat, als, terwijl (verb last).",
    "Only omdat can answer a waarom-question on its own: Waarom? Omdat het regent."],
 ex:[["Ik ga naar huis, want ik ben moe.","I am going home, because I am tired."],["Ik ga naar huis omdat ik moe ben.","I am going home because I am tired."]],
 d:[{q:"Ik kom niet, want ik ___ ziek.",o:["ben","ziek ben"],a:0,h:"want keeps normal order"},
    {q:"Ik kom niet omdat ik ziek ___.",o:["ben","ben ziek"],a:0,h:"omdat pushes the verb last"},
    {q:"Waarom kom je niet? ___ ik ziek ben.",o:["Omdat","Want"],a:0,h:"want cannot start an answer"}]},

{id:"g18", mem:"Adjectives take -e almost always. The single exception: een + het-word — 'een groot huis'. One exception, memorise that one.",lv:"A2",t:"Adjective endings",
 why:"One -e that appears or disappears. It is small but constant, so errors here are noticeable.",
 r:["After de, het, deze, die, mijn etc.: always add -e. de grote tafel, het nieuwe huis.",
    "After een + het-word: no -e. een nieuw huis.",
    "After een + de-word: add -e. een grote tafel.",
    "No article + het-word singular: no -e. koud water. Plural always takes -e: koude dagen."],
 ex:[["een groot project","a big project (het project)"],["een grote uitdaging","a big challenge (de uitdaging)"],["het grote project","the big project"]],
 d:[{q:"een ___ paneel (nieuw, het paneel)",o:["nieuw","nieuwe"],a:0,h:"een + het-word → no -e"},
    {q:"de ___ batterij (groot)",o:["grote","groot"],a:0,h:"after de → always -e"},
    {q:"een ___ oplossing (goed, de oplossing)",o:["goede","goed"],a:0,h:"een + de-word → -e"}]},

{id:"g19", mem:"-er and -st like English, but 'r' needs a shim: duur→duurder. And goed→beter→best, the same family as good-better-best.",lv:"A2",t:"Comparative and superlative",
 why:"Needed for every comparison you make at work or in a shop.",
 r:["+er and +st: goedkoop → goedkoper → goedkoopst",
    "Irregular: goed→beter→best, veel→meer→meest, weinig→minder→minst, graag→liever→liefst",
    "Adjectives ending in -r add -der: duur → duurder",
    "than = dan. as … as = even … als / net zo … als.",
    "Superlative takes het: Deze optie is het goedkoopst."],
 ex:[["Deze module is efficiënter dan die.","This module is more efficient than that one."],["Dit is de beste oplossing.","This is the best solution."],["Zonne-energie is net zo goedkoop als gas.","Solar is just as cheap as gas."]],
 d:[{q:"Deze batterij is ___ dan die. (groot)",o:["groter","meer groot"],a:0,h:"Dutch uses -er, never 'meer'"},
    {q:"Dit is de ___ optie. (duur)",o:["duurste","duurdere"],a:0,h:"superlative + e after de"},
    {q:"Hij werkt ___ dan ik. (hard)",o:["harder","harderder"],a:0,h:"just one -er"}]},

{id:"g20", mem:"Dutch people wash themselves: 'Ik was me.' The mirror-word (me/je/zich/ons) sits right after the verb.",lv:"A2",t:"Reflexive verbs",
 why:"Dutch marks many everyday actions as reflexive where English does not: zich aankleden, zich haasten, zich voelen.",
 r:["me, je, zich, ons, je, zich",
    "Ik voel me goed. Hij voelt zich niet lekker. Wij vergissen ons.",
    "The reflexive sits right after the verb in a main clause.",
    "Common: zich voelen, zich haasten, zich vervelen, zich herinneren, zich aankleden, zich zorgen maken."],
 ex:[["Ik voel me vandaag beter.","I feel better today."],["Maak je geen zorgen.","Don't worry."],["Hij vergist zich.","He is mistaken."]],
 d:[{q:"Ik herinner ___ die vergadering.",o:["me","zich"],a:0,h:"first person → me"},
    {q:"Zij voelt ___ niet lekker.",o:["zich","haar"],a:0,h:"third person → zich"},
    {q:"We moeten ___ haasten.",o:["ons","zich"],a:0,h:"wij → ons"}]},

{id:"g21", mem:"om ... te = 'in order to'. If you can say 'in order to' in English, you need om.",lv:"A2",t:"te + infinitive and om te",
 why:"How Dutch says 'to do something' as a purpose or after certain verbs.",
 r:["Purpose (in order to) = om … te + infinitive: Ik bel om een afspraak te maken.",
    "After proberen, beginnen, vergeten, hopen, beloven, besluiten: plain te. Ik probeer het te begrijpen.",
    "After modals (kunnen, moeten, willen, mogen, zullen) and gaan/komen/laten/horen/zien: no te.",
    "te goes directly before the final infinitive; separable verbs split around it: op te staan, mee te nemen."],
 ex:[["Ik ga naar de winkel om brood te kopen.","I go to the shop to buy bread."],["Vergeet niet de bijlage mee te sturen.","Don't forget to attach the file."],["Ik moet nu gaan.","I have to go now."]],
 d:[{q:"Ik bel je ___ het plan te bespreken.",o:["om","voor"],a:0,h:"purpose = om … te"},
    {q:"Hij probeert het probleem ___ lossen.",o:["op te","te op"],a:0,h:"te goes inside the separable verb"},
    {q:"We willen morgen ___.",o:["beginnen","te beginnen"],a:0,h:"after a modal, no te"}]},

{id:"g22", mem:"Commands are the bare stem: 'Kom!'. Add 'maar', 'even' or 'eens' and an order becomes an invitation: 'Kom maar even.'",lv:"A2",t:"Imperative and polite requests",
 why:"Instructions and requests come up daily at work and in shops.",
 r:["Imperative = bare stem: Kom binnen. Kijk hier. Stuur het rapport.",
    "Politeness is usually added with even, eens, alsjeblieft/alstublieft: Stuur je het even?",
    "Formal: verb + u. Komt u binnen. Or use a question: Kunt u mij helpen?",
    "Negative instruction: Niet doen. / Doe dat niet."],
 ex:[["Kom binnen en ga zitten.","Come in and sit down."],["Kunt u dat herhalen, alstublieft?","Could you repeat that, please?"],["Stuur me even de link.","Just send me the link."]],
 d:[{q:"___ de deur, alsjeblieft. (sluiten)",o:["Sluit","Sluiten"],a:0,h:"imperative = bare stem"},
    {q:"___ u mij helpen?",o:["Kunt","Kan"],a:0,h:"u takes -t"},
    {q:"___ me morgen even.",o:["Bel","Belt"],a:0,h:"informal imperative"}]},

{id:"g23", mem:"The imperfectum is the storyteller's tense: -de/-te after soft sounds, but after 't kofschip letters (t,k,f,s,ch,p) it's -te.",lv:"B1",t:"Simple past (imperfectum)",
 why:"Used for background, descriptions, stories and in writing. You need it to read and to sound natural about the past.",
 r:["Weak verbs: stem + te(n) or de(n). Use -te after 'soft ketchup' consonants (t,k,f,s,ch,p), otherwise -de.",
    "werken→werkte/werkten, horen→hoorde/hoorden",
    "Strong verbs change the vowel: schrijven→schreef/schreven, gaan→ging/gingen, zien→zag/zagen",
    "was/waren, had/hadden, kon/konden, moest/moesten, wilde/wilden, mocht/mochten."],
 ex:[["Vorig jaar werkte ik in Duitsland.","Last year I worked in Germany."],["Het was koud en het regende.","It was cold and it was raining."],["Ik had geen tijd.","I had no time."]],
 d:[{q:"Vroeger ___ hij in Rotterdam. (wonen)",o:["woonde","woonte"],a:0,h:"stem ends in n → -de"},
    {q:"We ___ het rapport gisteren. (versturen)",o:["verstuurden","verstuurdeden"],a:0,h:"plural = -den"},
    {q:"Ik ___ het niet. (weten)",o:["wist","weette"],a:0,h:"irregular: weten, wist, geweten"}]},

{id:"g24", mem:"One event = perfect. A running background or a habit = imperfect. 'Ik heb gebeld terwijl ik wachtte.'",lv:"B1",t:"Perfect or imperfect?",
 why:"Both are 'past'. Dutch chooses between them by function, not by time.",
 r:["Perfect: a single completed fact, news, something relevant now. Ik heb de offerte verstuurd.",
    "Imperfect: background, description, habits, and once a story is running. Ik werkte daar drie jaar.",
    "Typical pattern: open with the perfect, then continue in the imperfect. Ik ben naar Delft geweest. Het was druk en ik moest lang wachten.",
    "In writing (reports, news) the imperfect dominates; in speech the perfect does."],
 ex:[["Ik heb hem gisteren gesproken. Hij was erg positief.","I spoke to him yesterday. He was very positive."],["Toen ik jong was, fietste ik elke dag.","When I was young I cycled every day."]],
 d:[{q:"Ik ___ net een mail gestuurd.",o:["heb","stuurde"],a:0,h:"single completed action, relevant now"},
    {q:"Toen ik in Spanje woonde, ___ het altijd warm.",o:["was","is geweest"],a:0,h:"background description → imperfect"},
    {q:"___ je het nieuws al gehoord?",o:["Heb","Hoorde"],a:0,h:"news → perfect"}]},

{id:"g25", mem:"The relative pronoun copies the article: de man die, het huis dat. het-word → dat, everything else → die.",lv:"B1",t:"Relative clauses: die, dat, wat",
 why:"Lets you build longer, adult sentences instead of a string of short ones.",
 r:["die for de-words and all plurals: de collega die belde, de panelen die geleverd zijn",
    "dat for het-words: het project dat vertraagd is",
    "wat after alles, iets, niets, het beste, and after a whole clause: alles wat ik weet",
    "With a preposition and a thing, use waar + preposition, written as one word: het bedrijf waarmee we werken, de kwestie waarover we spraken.",
    "For people, keep the preposition: de collega met wie ik werk.",
    "The verb goes to the end of the relative clause."],
 ex:[["De offerte die we gisteren stuurden, is goedgekeurd.","The quote we sent yesterday has been approved."],["Het systeem dat we gebruiken is nieuw.","The system we use is new."],["Dat is alles wat ik weet.","That is all I know."]],
 d:[{q:"Het rapport ___ ik schreef, is klaar.",o:["dat","die"],a:0,h:"het rapport → dat"},
    {q:"De klanten ___ we spraken, waren tevreden.",o:["die","dat"],a:0,h:"plural → die"},
    {q:"Het project ___ we aan werken.",o:["waaraan","aan dat"],a:0,h:"preposition + thing → waar + prep"}]},

{id:"g26", mem:"'er' is Dutch duct tape: place (=there), quantity ('ik heb er twee'), introducing ('er is'), and glued to prepositions (erover, ermee).",lv:"B1",t:"The four jobs of 'er'",
 why:"Native speakers use er in almost every other sentence, and it is invisible in English. This is the single hardest small word in Dutch.",
 r:["1. Place (= there): Ik ben er al. ",
    "2. With a number or quantity: Hoeveel panelen heb je? Ik heb er twintig.",
    "3. Replacing a thing after a preposition: Ik denk aan het project → Ik denk eraan. / Denk je er nog aan?",
    "4. Dummy subject with an indefinite subject: Er staat een auto voor de deur.",
    "In a sentence er and the preposition can split: Ik heb er niet over nagedacht."],
 ex:[["Er zijn drie opties.","There are three options."],["Ik heb er geen tijd voor.","I have no time for it."],["Woon je hier? Ja, ik woon er al tien jaar.","Do you live here? Yes, I have lived here for ten years."]],
 d:[{q:"Hoeveel batterijen heb je? Ik heb ___ vier.",o:["er","ze"],a:0,h:"quantity → er"},
    {q:"Ik heb ___ nog niet over nagedacht.",o:["er","het"],a:0,h:"replaces a thing after a preposition"},
    {q:"___ ligt een pakket voor de deur.",o:["Er","Het"],a:0,h:"indefinite subject → dummy er"}]},

{id:"g27", mem:"Plans use gaan, promises and predictions use zullen. 'Ik ga sporten' (plan) vs 'Ik zal je helpen' (promise).",lv:"B1",t:"Future: gaan or zullen",
 why:"Dutch mostly uses the present for the future. Overusing zullen sounds textbook-ish.",
 r:["Present tense + a time word covers most futures: Ik bel je morgen.",
    "gaan + infinitive = an intention or a plan: We gaan het systeem uitbreiden.",
    "zullen = a promise, an offer, or a formal prediction: Ik zal het regelen. Zal ik je helpen?",
    "Zullen we…? is the standard way to propose something: Zullen we maandag afspreken?"],
 ex:[["Volgende week begin ik met het ontwerp.","Next week I start the design."],["We gaan volgend jaar uitbreiden.","We are going to expand next year."],["Zal ik het even sturen?","Shall I send it?"]],
 d:[{q:"___ we morgen om tien uur afspreken?",o:["Zullen","Gaan"],a:0,h:"proposal → Zullen we"},
    {q:"Ik ___ je vanavond bellen. (belofte)",o:["zal","ga"],a:0,h:"promise → zullen"},
    {q:"We ___ volgende maand verhuizen. (plan)",o:["gaan","zullen"],a:0,h:"plan → gaan"}]},

{id:"g28", mem:"Verb and preposition are married: wachten OP, denken AAN, zoeken NAAR. Never learn the verb alone — learn the couple.",lv:"B1",t:"Fixed verb + preposition pairs",
 why:"Dutch prepositions almost never map onto English ones. Learn the verb and its preposition as one unit.",
 r:["denken aan (think of), wachten op (wait for), luisteren naar (listen to), kijken naar (look at)",
    "zoeken naar, vragen om, praten/spreken over, twijfelen aan, rekenen op, zorgen voor",
    "beginnen met, stoppen met, bezig zijn met, tevreden zijn over, geïnteresseerd zijn in",
    "afhangen van, bestaan uit, deelnemen aan, reageren op, verantwoordelijk zijn voor"],
 ex:[["Ik wacht op je reactie.","I am waiting for your reply."],["Dat hangt af van het budget.","That depends on the budget."],["We zijn tevreden over het resultaat.","We are satisfied with the result."]],
 d:[{q:"Ik reken ___ jou.",o:["op","aan"],a:0,h:"rekenen op = count on"},
    {q:"Het systeem bestaat ___ drie delen.",o:["uit","van"],a:0,h:"bestaan uit = consist of"},
    {q:"Zij is verantwoordelijk ___ de planning.",o:["voor","van"],a:0,h:"verantwoordelijk voor"}]},

{id:"g29", mem:"-je makes anything small, cute, or friendly — and always het: het biertje, het momentje. Diminutives are how Dutch smiles.",lv:"B1",t:"Diminutives (-je)",
 why:"Dutch uses -je far more than English uses 'little'. It signals small, casual, friendly, or 'just a quick one'.",
 r:["-je, and after certain sounds -tje, -pje, -kje, -etje: huisje, autootje, boompje, koninkje, mannetje",
    "All diminutives are het-words and take -s in the plural: het kopje, twee kopjes.",
    "Very often it softens rather than shrinks: een vraagje, een momentje, een biertje, een afspraakje.",
    "Overuse sounds childish; underuse sounds stiff. Copy what you hear."],
 ex:[["Heb je even een momentje?","Do you have a moment?"],["Ik heb nog een vraagje.","I have one small question."],["Twee koffie en een broodje, alstublieft.","Two coffees and a roll, please."]],
 d:[{q:"Ik heb nog een klein ___. (vraag)",o:["vraagje","vraagtje"],a:0,h:"-g → -je"},
    {q:"___ kopje is leeg.",o:["Het","De"],a:0,h:"all diminutives are het-words"},
    {q:"Zullen we een ___ drinken? (biertje/bier)",o:["biertje","bier"],a:0,h:"casual invitation → diminutive"}]},

{id:"g30", mem:"worden = becoming done (is being built), zijn = already done (is built). 'wordt gebouwd' vs 'is gebouwd'.",lv:"B1",t:"Passive voice",
 why:"Reports, procedures, permits and specifications in Dutch are heavily passive. You must be able to read and write it.",
 r:["Present/past passive: worden + past participle. De panelen worden morgen geleverd.",
    "Perfect passive: zijn + participle + geworden → in practice: De panelen zijn geleverd.",
    "The agent is added with door: Het rapport wordt door de adviseur geschreven.",
    "Past: De vergunning werd in 2023 verleend."],
 ex:[["Het systeem wordt elk jaar geïnspecteerd.","The system is inspected every year."],["De aanvraag is goedgekeurd.","The application has been approved."],["De kabels werden vorige week gelegd.","The cables were laid last week."]],
 d:[{q:"De offerte ___ morgen verstuurd.",o:["wordt","is"],a:0,h:"present passive → worden"},
    {q:"Het rapport is gisteren ___. (afronden)",o:["afgerond","afronden"],a:0,h:"participle"},
    {q:"De installatie werd ___ een externe partij uitgevoerd.",o:["door","van"],a:0,h:"agent = door"}]},

{id:"g31", mem:"zou is the polite ghost of zullen: it makes requests softer and futures uncertain. When unsure, reach for zou.",lv:"B1",t:"Conditional: als and zou",
 why:"For proposals, hypotheses and polite requests — all central at B1/B2.",
 r:["Real condition: Als het morgen regent, gaan we niet. (present + present)",
    "Unreal present: Als ik meer tijd had, zou ik het zelf doen.",
    "Unreal past: Als we eerder begonnen waren, zouden we het gehaald hebben.",
    "zou/zouden + infinitive also softens: Zou je dat kunnen sturen? Ik zou zeggen dat…"],
 ex:[["Als ik jou was, zou ik het niet doen.","If I were you, I would not do it."],["Zou u dat kunnen bevestigen?","Could you confirm that?"],["Ik zou graag een afspraak maken.","I would like to make an appointment."]],
 d:[{q:"Als ik tijd ___, zou ik meekomen.",o:["had","heb"],a:0,h:"unreal → imperfect in the als-clause"},
    {q:"___ je me het bestand kunnen sturen?",o:["Zou","Zal"],a:0,h:"polite request → zou"},
    {q:"Als het lukt, ___ we volgende week starten.",o:["kunnen","zouden kunnen hebben"],a:0,h:"real condition, present"}]},

{id:"g32", mem:"Three families: en/maar/want/of/dus change nothing; omdat & friends drag verbs to the end; daarom & friends flip verb-subject.",lv:"B1",t:"Conjunctions and word order: the full picture",
 why:"One table that ties V2, want/omdat and subclauses together. Worth reviewing until it is automatic.",
 r:["No change (coordinating): en, maar, want, of, dus → Ik blijf thuis, want het regent.",
    "Inversion after these adverbs at the start: dus, daarom, toch, dan, ook, bovendien, echter → Daarom blijf ik thuis.",
    "Verb to the end (subordinating): omdat, dat, als, toen, terwijl, hoewel, zodat, voordat, nadat, of, sinds, wanneer",
    "toen = when, for a single past event. wanneer/als = when, for present/future or repetition."],
 ex:[["Het regende, dus ik bleef thuis.","It rained, so I stayed home."],["Daarom ben ik niet gekomen.","That is why I did not come."],["Toen ik in Delft studeerde, fietste ik veel.","When I studied in Delft, I cycled a lot."]],
 d:[{q:"Het is laat, ___ ga ik naar huis.",o:["dus","omdat"],a:0,h:"coordinating result"},
    {q:"___ ik klaar was, belde ik hem.",o:["Toen","Als"],a:0,h:"single past event → toen"},
    {q:"Bovendien ___ het te duur.",o:["is","het is"],a:0,h:"bovendien triggers inversion"}]},

{id:"g33", mem:"Two verbs pile up at the end in fixed order: '... omdat ik morgen moet werken.' The helper verb comes first, the action last.",lv:"B2",t:"Two verbs at the end of a subclause",
 why:"At B2 your sentences get longer and you have to park two or three verbs at the end in the right order.",
 r:["Perfect in a subclause: the auxiliary can go before or after the participle. …omdat ik het gezien heb / …omdat ik het heb gezien. Both are correct; the second is more common in speech.",
    "Modal + infinitive: the auxiliary comes first. …omdat ik het moet doen.",
    "Double infinitive: after a modal, the participle becomes an infinitive. Ik heb het niet kunnen doen. (not 'gekund')",
    "Same with laten, zien, horen: Ik heb hem zien vertrekken."],
 ex:[["Ik weet dat hij het rapport heeft gestuurd.","I know he sent the report."],["We hebben de levering niet kunnen bevestigen.","We were not able to confirm the delivery."],["Hij zei dat hij morgen zou komen.","He said he would come tomorrow."]],
 d:[{q:"Ik heb het niet ___ afronden.",o:["kunnen","gekund"],a:0,h:"double infinitive after a modal"},
    {q:"…omdat we het budget ___ verhogen.",o:["moeten","moeten te"],a:0,h:"modal first, then infinitive"},
    {q:"Ik denk dat zij het al ___.",o:["heeft gezien","gezien heeft is"],a:0,h:"auxiliary + participle at the end"}]},

{id:"g34", mem:"In email, zou is a suit and tie: 'Zou u ... kunnen ...?' is the standard polite skeleton of Dutch business requests.",lv:"B2",t:"zou / zouden in professional Dutch",
 why:"The main politeness and distance tool in Dutch meetings and email.",
 r:["Softened opinion: Ik zou zeggen dat we beter kunnen wachten.",
    "Polite request: Zou je het willen nakijken?",
    "Reported/unverified: Het zou om een storing gaan. (apparently it is a fault)",
    "Suggestion: Je zou het ook anders kunnen aanpakken.",
    "Dropping zou makes you sound blunt in Dutch business settings — but Dutch is direct, so do not stack softeners either."],
 ex:[["Ik zou voorstellen om het uit te stellen.","I would suggest postponing it."],["Zou u dat kunnen toelichten?","Could you explain that?"],["Dat zou een probleem kunnen zijn.","That could be a problem."]],
 d:[{q:"___ u het contract willen ondertekenen?",o:["Zou","Zal"],a:0,h:"polite request"},
    {q:"Ik ___ zeggen dat het haalbaar is.",o:["zou","zal"],a:0,h:"softened opinion"},
    {q:"Dat ___ tot vertraging kunnen leiden.",o:["zou","wordt"],a:0,h:"hypothetical possibility"}]},

{id:"g35", mem:"Four load-bearing connectors carry any argument: ten eerste, bovendien, daarentegen, kortom — first, moreover, however, in short.",lv:"B2",t:"Connectors for argument",
 why:"B2 is judged largely on whether you can structure an argument. These words do that work.",
 r:["Adding: bovendien, daarnaast, tevens, verder",
    "Contrast: echter, daarentegen, hoewel, ondanks (het feit dat), toch, terwijl",
    "Cause/result: daardoor, daarom, dus, vandaar dat, aangezien, doordat",
    "Condition: mits (provided that), tenzij (unless), als, indien (formal)",
    "Summing up: kortom, al met al, samenvattend, ten slotte",
    "Watch the word order: hoewel/aangezien/mits/tenzij send the verb to the end; echter/daarom/bovendien trigger inversion."],
 ex:[["Hoewel de kosten hoger zijn, is de terugverdientijd korter.","Although the costs are higher, the payback period is shorter."],["De opbrengst valt tegen; daarom passen we het ontwerp aan.","The yield is disappointing; that is why we are adjusting the design."],["We kunnen leveren, mits de vergunning op tijd rond is.","We can deliver, provided the permit is granted in time."]],
 d:[{q:"___ het duur is, kiezen we ervoor.",o:["Hoewel","Echter"],a:0,h:"needs a subordinator with verb-final"},
    {q:"De prijs stijgt. ___ passen we het budget aan.",o:["Daarom","Omdat"],a:0,h:"result adverb starting a main clause"},
    {q:"We starten morgen, ___ het weer meezit.",o:["mits","hoewel"],a:0,h:"condition = provided that"}]},

{id:"g36", mem:"Formal Dutch swaps words, not grammar: krijgen→ontvangen, ook→tevens, maar→echter. Same skeleton, better suit.",lv:"B2",t:"Formal and written register",
 why:"Reports, permit applications and client email use a distinctly different Dutch from speech.",
 r:["u instead of je; u heeft or u hebt (both fine), u bent",
    "Passive and nominalisation: De uitvoering vindt plaats in maart. instead of We voeren het in maart uit.",
    "Formal alternatives: indien (als), teneinde (om te), dient te (moet), betreffende (over), circa (ongeveer), reeds (al), tevens (ook)",
    "Email openers: Geachte heer/mevrouw, — Beste Jan, — Met vriendelijke groet, / Met vriendelijke groeten,",
    "Do not over-formalise a Dutch email: Beste + first name is normal even with clients."],
 ex:[["Hierbij stuur ik u de offerte.","Please find the quote attached."],["De werkzaamheden dienen voor 1 mei te zijn afgerond.","The work must be completed before 1 May."],["Naar aanleiding van ons gesprek…","Following our conversation…"]],
 d:[{q:"___ heer De Vries,",o:["Geachte","Beste geachte"],a:0,h:"standard formal opener"},
    {q:"De aanvraag ___ voor 1 juni te worden ingediend.",o:["dient","moet te"],a:0,h:"formal: dient te"},
    {q:"___ u nog vragen heeft, hoor ik het graag.",o:["Indien","Als dat"],a:0,h:"formal 'if'"}]},

{id:"g37", mem:"Reported speech = dat + verb magnet: 'Hij zegt dat hij morgen komt.' Say-verb, dat, everything to the end.",lv:"B2",t:"Reported speech",
 why:"Summarising what a client or colleague said is a core B2 task in meetings and minutes.",
 r:["dat + verb to the end: Hij zei dat het project vertraagd is.",
    "Backshift is optional in Dutch, unlike English. Hij zei dat hij komt / dat hij zou komen are both used.",
    "Questions: of for yes/no, question word otherwise. Ze vroeg of we konden leveren. Ze vroeg wanneer we konden leveren.",
    "Distance markers: naar verluidt, volgens hem, zou (zie kaart 34)."],
 ex:[["Hij gaf aan dat de vergunning binnen is.","He indicated the permit has been granted."],["Ze vroeg of we het kunnen versnellen.","She asked whether we can speed it up."],["Volgens de netbeheerder duurt het nog een jaar.","According to the grid operator it will take another year."]],
 d:[{q:"Ze vroeg ___ we op tijd zijn.",o:["of","dat"],a:0,h:"yes/no question → of"},
    {q:"Hij zei dat hij het rapport ___.",o:["stuurt","stuurt het"],a:0,h:"verb at the end"},
    {q:"___ de aannemer is de planning haalbaar.",o:["Volgens","Volgens aan"],a:0,h:"according to"}]},

{id:"g38", mem:"Own three openers and you can run any Dutch meeting: 'Ik stel voor...', 'Zullen we...', 'Kunnen we afspreken dat...'.",lv:"B2",t:"Meeting and negotiation phrases",
 why:"Fixed patterns you can drop straight into a Dutch project meeting. Learn them as blocks, not as grammar.",
 r:["Proposing: Ik stel voor om… / Zullen we…? / Wat als we…?",
    "Agreeing: Daar ben ik het mee eens. / Dat lijkt me een goed idee. / Akkoord.",
    "Disagreeing politely: Ik zie dat anders. / Daar ben ik het niet helemaal mee eens. / Ik heb daar mijn twijfels over.",
    "Asking for clarity: Wat bedoel je precies met…? / Kun je dat toelichten?",
    "Managing: Laten we dat parkeren. / Kunnen we daar later op terugkomen? / Wie pakt dit op?",
    "Closing: Zijn we het daarover eens? / Dan spreken we af dat… / Ik zet het in de actielijst."],
 ex:[["Ik stel voor om de oplevering met twee weken uit te stellen.","I propose postponing delivery by two weeks."],["Daar ben ik het niet helemaal mee eens.","I don't entirely agree with that."],["Wie pakt dit op?","Who will take this on?"]],
 d:[{q:"Ik stel voor ___ het ontwerp aan te passen.",o:["om","dat"],a:0,h:"ik stel voor om … te"},
    {q:"Daar ben ik het mee ___.",o:["eens","akkoord"],a:0,h:"het eens zijn met"},
    {q:"Kun je dat even ___?",o:["toelichten","toelicht"],a:0,h:"infinitive after kunnen"}]},
  {id:"g39", mem:"hoeven only exists with niet: 'Je hoeft niet te komen' is how Dutch softens 'you must not bother'. moeten = must, niet hoeven te = don't have to.", t:"niet hoeven te: the friendly opposite of moeten", lv:"A2",
   why:"'Je moet niet komen' sounds like a warning. Real Dutch says 'Je hoeft niet te komen' — you don't have to. You will hear and need this daily.",
   r:["moeten = must / have to. The negative of obligation is NOT 'moet niet' but 'hoeft niet te'.",
      "Pattern: hoeven + niet/geen/alleen + te + infinitive.",
      "'Je moet niet ...' exists too, but it means 'you should not' (advice/warning).",
      "With geen: 'Je hoeft geen cadeau mee te nemen.'"],
   ex:[["U hoeft niet te wachten, ik bel u terug.","You don't have to wait, I'll call you back."],
       ["We hoeven vandaag niet te vergaderen.","We don't need to meet today."],
       ["Je hoeft alleen je naam in te vullen.","You only need to fill in your name."]],
   d:[{q:"Je ___ niet te betalen, het is gratis.",o:["hoeft","moet"],a:0,h:"no obligation = hoeven"},
      {q:"U hoeft geen afspraak ___ maken.",o:["te","om"],a:0,h:"hoeven + te + infinitive"},
      {q:"'You must not touch that' (warning) = Je ___ dat niet aanraken.",o:["moet","hoeft"],a:0,h:"a warning keeps moeten"}]},
  {id:"g40", mem:"Dutch has no -ing tense; it says 'at the working': ik ben AAN HET werken. Busy right now? Reach for aan het.", t:"Busy right now: aan het + infinitive", lv:"A2",
   why:"English says 'I am working'. Dutch has no -ing form; the everyday equivalent is zijn + aan het + infinitive, plus zitten/staan/liggen + te for postures.",
   r:["zijn + aan het + infinitive = to be busy doing: 'Ik ben aan het koken.'",
      "The infinitive goes to the end: 'Hij is de auto aan het repareren.'",
      "Posture verbs + te: 'Ze zit te lezen', 'Hij staat te wachten', 'De kat ligt te slapen.'",
      "Only for actions in progress — habits use the simple present: 'Ik werk elke dag.'"],
   ex:[["Stil even, ik ben aan het bellen.","Quiet a moment, I am on the phone."],
       ["De monteur is de omvormer aan het vervangen.","The technician is replacing the inverter."],
       ["Ze zat de hele avond te studeren.","She sat studying all evening."]],
   d:[{q:"Ik kan nu niet praten, ik ben ___ het koken.",o:["aan","bij"],a:0,h:"aan het + infinitive"},
      {q:"Hij is zijn e-mail aan het ___.",o:["lezen","leest"],a:0,h:"infinitive at the end"},
      {q:"Ze zit al een uur ___ wachten.",o:["te","aan het"],a:0,h:"zitten/staan/liggen + te"}]},
  {id:"g41", mem:"The past behind the past: had/was + participle. When two past events queue up, the earlier one gets 'had': 'Ik had al gegeten toen hij kwam.'", t:"Past perfect: had gedaan", lv:"B1",
   why:"To tell any story you need to mark which past event happened first. Dutch uses had/was + participle, exactly like English 'had done'.",
   r:["hadden-verbs: had/hadden + participle: 'Ik had al betaald.'",
      "zijn-verbs keep zijn, but in the past: was/waren + participle: 'De trein was al vertrokken.'",
      "Typical partners: toen, al, nog niet, voordat: 'Voordat ik aankwam, was hij al weggegaan.'",
      "Same hebben/zijn choice as the normal perfect (movement & change take was/waren)."],
   ex:[["Toen wij aankwamen, was de vergadering al begonnen.","When we arrived, the meeting had already begun."],
       ["Ik had de e-mail nog niet gelezen.","I had not read the email yet."],
       ["Ze hadden het contract al getekend voordat wij belden.","They had already signed the contract before we called."]],
   d:[{q:"Toen ik thuiskwam, ___ het eten al klaar.",o:["was","is"],a:0,h:"earlier past = was"},
      {q:"Ik ___ nog nooit zo'n groot project gedaan.",o:["had","heb"],a:0,h:"past before another past"},
      {q:"De trein ___ al vertrokken toen we aankwamen.",o:["was","had"],a:0,h:"vertrekken travels with zijn"}]},
];

// ---------- PRONUNCIATION ----------
const SOUNDS = [
{id:"s1",t:"g / ch",tip:"The famous hard Dutch g. Made at the back of the throat, like clearing it gently. Same sound for g and ch. In the south of the Netherlands and in Belgium it is much softer.",
 w:["goed","gaan","geld","lachen","acht","genoeg","gracht","dag"]},
{id:"s2",t:"ui",tip:"No English equivalent. Round your lips as for 'oo', then say 'ay' without moving them. Do not say 'oy'.",
 w:["huis","uit","buiten","ui","tuin","bruin","sluiten","muis"]},
{id:"s3",t:"eu",tip:"Lips rounded as for 'oo', tongue positioned as for 'ay'. Close to the French 'eu' in 'deux'.",
 w:["neus","deur","keuken","kleur","leuk","euro","zeuren","beurt"]},
{id:"s4",t:"ij / ei",tip:"Both are pronounced identically, roughly like the English 'ay' in 'day' but tighter and shorter. Spelling differs, sound does not.",
 w:["mijn","tijd","blij","klein","trein","eind","wijn","reis"]},
{id:"s5",t:"oe",tip:"Like the 'oo' in 'book' but longer and tighter. Never like English 'oh'.",
 w:["boek","goed","voet","stoel","bloem","zoeken","moeder","koe"]},
{id:"s6",t:"sch / schr",tip:"s + the hard g sound, in that order. Not 'sh'. At the end of a word (-isch) it is just 's'.",
 w:["school","schrijven","schoon","misschien","scheiden","logisch","praktisch","schaal"]},
{id:"s7",t:"r",tip:"Both a rolled tip-of-tongue r and a throaty French-style r are accepted. Pick one and stay consistent. At the end of a word many speakers soften it.",
 w:["rood","werken","voorbeeld","tijger","broer","raar","waar","kort"]},
{id:"s8",t:"Final devoicing",tip:"At the end of a word, d sounds like t and b sounds like p. Spelling stays the same.",
 w:["hond (hont)","goed (goet)","web (wep)","hand (hant)","bed (bet)","rood (root)","brood (broot)","tijd (tijt)"]},
];

 l:[[0,"Mijn laptop heeft geen internet. Bij jou wel?","My laptop has no internet. Does yours work?"],
    [1,"Ja, bij mij doet de wifi het gewoon.","Yes, my Wi-Fi is working fine."],
    [0,"Welk netwerk gebruik jij? En wat is het wachtwoord?","Which network do you use? And what is the password?"],
    [1,"Kantoor-2, het wachtwoord staat op het bord bij de printer.","Kantoor-2, the password is on the board by the printer."],
    [0,"Gevonden. Even opnieuw verbinden… ja, het werkt!","Found it. Let me reconnect… yes, it works!"],
    [1,"Mooi. Stuur je me dat bestand dan even door?","Great. Will you forward me that file then?"]]},

{id:"c09",u:"feelings",t:"Zenuwachtig voor de presentatie",scene:"😰🎤💪",set:"A friend calms another down before a talk.",
 sp:["Sanne","Bram"],
 l:[[0,"Gaat het? Je kijkt zo gestrest.","Are you okay? You look so stressed."],
    [1,"Ik ben zenuwachtig voor mijn presentatie straks.","I am nervous about my presentation later."],
    [0,"Dat snap ik, maar je hebt goed geoefend.","I understand, but you have practised well."],
    [1,"Ik ben bang dat ik iets vergeet.","I am afraid I will forget something."],
    [0,"Haal rustig adem. En niemand ziet je notities.","Breathe calmly. And nobody sees your notes."],
    [1,"Je hebt gelijk. Bedankt, ik voel me al iets rustiger.","You are right. Thanks, I already feel a bit calmer."]]},

{id:"c10",u:"weather",t:"Wat een weer!",scene:"🌧️💨☂️",set:"Classic Dutch small talk at the bus stop.",
 sp:["Pieter","Anouk"],
 l:[[0,"Wat een weer, hè? Het regent al de hele dag.","What weather, right? It has been raining all day."],
    [1,"Ja, en die wind! Mijn paraplu is bijna kapot.","Yes, and that wind! My umbrella is almost broken."],
    [0,"Morgen wordt het beter, zeggen ze. Droog en twaalf graden.","Tomorrow will be better, they say. Dry and twelve degrees."],
    [1,"Dat zeiden ze gisteren ook.","They said that yesterday too."],
    [0,"Haha, typisch Nederland.","Haha, typical Netherlands."],
    [1,"Daar komt de bus. Eindelijk!","There comes the bus. Finally!"]]},

{id:"c11",u:"shopping",t:"Terugbrengen zonder bon",scene:"🛒🧾🔁",set:"Returning a purchase at the service desk.",
 sp:["Lisa","Medewerker"],
 l:[[0,"Ik wil deze waterkoker graag terugbrengen. Hij doet het niet.","I would like to return this kettle. It does not work."],
    [1,"Heeft u de bon nog?","Do you still have the receipt?"],
    [0,"Nee, maar ik heb met mijn pinpas betaald.","No, but I paid with my debit card."],
    [1,"Dan kan ik het opzoeken. Wanneer heeft u hem gekocht?","Then I can look it up. When did you buy it?"],
    [0,"Vorige week zaterdag, rond drie uur.","Last Saturday, around three o'clock."],
    [1,"Gevonden. U krijgt het geld terug op uw rekening.","Found it. You will get the money back on your account."]]},

{id:"c12",u:"clothes",t:"In de kledingwinkel",scene:"🧥👖🪞",set:"Trying on a winter coat.",
 sp:["Tom","Verkoopster"],

    [1,"Deze donkerblauwe is heel populair. Wilt u hem passen?","This dark blue one is very popular. Would you like to try it on?"],
    [0,"Graag. … Hij zit een beetje strak bij de schouders.","Yes please. … It is a bit tight at the shoulders."],
    [1,"Ik pak een maatje groter voor u.","I will get you one size bigger."],
    [0,"Ja, deze zit perfect. Wat kost hij?","Yes, this one fits perfectly. How much is it?"],
    [1,"Honderdtwintig euro, maar deze week met twintig procent korting.","One hundred and twenty euros, but this week with twenty percent off."]]},

{id:"c13",u:"transport",t:"Vertraging op het spoor",scene:"🚆⏳📢",set:"Two strangers on a delayed platform.",
 sp:["Femke","Jan"],
 l:[[0,"Weet u waarom de trein vertraging heeft?","Do you know why the train is delayed?"],
    [1,"Er is een storing bij Amsterdam. Twintig minuten, zeiden ze.","There is a failure near Amsterdam. Twenty minutes, they said."],
    [0,"Dan mis ik mijn overstap in Utrecht.","Then I will miss my connection in Utrecht."],
    [1,"Er gaat om kwart over ook een intercity. Die haalt u makkelijk.","There is also an intercity at quarter past. You will easily make that."],
    [0,"Gelukkig. Van welk spoor vertrekt die?","Luckily. Which platform does it leave from?"],
    [1,"Spoor vijf, aan de andere kant.","Platform five, on the other side."]]},

{id:"c14",u:"health",t:"Bij de huisarts",scene:"🩺💊🗓️",set:"Describing symptoms to the doctor.",
 sp:["Dokter","Sophie"],
 l:[[0,"Goedemiddag, vertelt u eens. Wat zijn de klachten?","Good afternoon, tell me. What are the complaints?"],
    [1,"Ik heb al een week hoofdpijn en ik slaap slecht.","I have had a headache for a week and I sleep badly."],
    [0,"Heeft u ook koorts of bent u misselijk?","Do you also have a fever or are you nauseous?"],
    [1,"Nee, alleen moe. Heel erg moe.","No, just tired. Very tired."],
    [0,"Ik denk dat het stress is. Rust nemen en veel water drinken.","I think it is stress. Take rest and drink a lot of water."],
    [1,"En als het niet beter wordt?","And if it does not get better?"],
    [0,"Dan komt u volgende week terug.","Then you come back next week."]]},

{id:"c15",u:"social",t:"Bij de koffieautomaat",scene:"☕💬😄",set:"Weekend small talk with a colleague.",
 sp:["Max","Emma"],
 l:[[0,"Goedemorgen! Hoe was je weekend?","Good morning! How was your weekend?"],
    [1,"Heel gezellig. We hadden vrienden te eten. En dat van jou?","Really gezellig. We had friends over for dinner. And yours?"],
    [0,"Rustig. Ik heb veel gefietst, langs de dijk.","Quiet. I cycled a lot, along the dike."],

    [0,"Goed idee. Twaalf uur in de kantine?","Good idea. Twelve o'clock in the canteen?"],

{id:"c16",u:"sport",t:"Heb je de wedstrijd gezien?",scene:"⚽📺🍺",set:"Monday-morning football talk.",
 sp:["Daan","Pieter"],
 l:[[0,"Heb je de wedstrijd gisteren gezien?","Did you see the match yesterday?"],
    [1,"Natuurlijk! Wat een doelpunt in de tweede helft.","Of course! What a goal in the second half."],
    [0,"Ik dacht echt dat ze gingen verliezen.","I really thought they were going to lose."],
    [1,"Ik ook. Twee-één, op het laatste moment.","Me too. Two-one, at the very last moment."],
    [0,"Speel jij zelf eigenlijk nog voetbal?","Do you actually still play football yourself?"],
    [1,"Elke zaterdag, bij de vereniging hier in het dorp. Doe een keer mee!","Every Saturday, at the club here in the village. Join us sometime!"]]},

    [0,"Klopt. Een tweepersoonskamer met ontbijt.","Correct. A double room with breakfast."],

    [1,"Dank u. Hoe laat is het ontbijt?","Thank you. What time is breakfast?"],
    [0,"Van zeven tot half elf, op de eerste verdieping.","From seven to half past ten, on the first floor."]]},

{id:"c18",u:"money",t:"Een rekening openen",scene:"🏦💳📄",set:"At the bank counter.",
 sp:["Bram","Bankmedewerker"],
 l:[[0,"Ik wil graag een betaalrekening openen.","I would like to open a checking account."],
    [1,"Dat kan. Heeft u een identiteitsbewijs en uw burgerservicenummer?","That is possible. Do you have ID and your citizen service number?"],
    [0,"Ja, allebei. Kost de rekening iets per maand?","Yes, both. Does the account cost anything per month?"],

{id:"c22",u:"energy1",t:"Zonnepanelen voor thuis",scene:"☀️🏠🔌",set:"A homeowner calls an installer.",
 sp:["Jan","Installateur"],
 l:[[0,"Wij denken aan zonnepanelen. Hoeveel passen er op ons dak?","We are thinking about solar panels. How many fit on our roof?"],
    [1,"Bij een gemiddeld rijtjeshuis meestal tien tot twaalf.","On an average terraced house usually ten to twelve."],
    [0,"En wat leveren die per jaar op?","And what do they produce per year?"],

    [0,"Wat is de terugverdientijd op dit moment?","What is the payback period at the moment?"],

{id:"c23",u:"climate",t:"Afval scheiden",scene:"♻️🗑️🌍",set:"Neighbours discussing the new waste rules.",
 sp:["Sophie","Pieter"],
 l:[[0,"Heb je de brief van de gemeente gelezen? Nieuwe regels voor afval.","Did you read the municipality's letter? New rules for waste."],
    [1,"Ja, plastic en gft apart, en de grijze bak nog maar één keer per maand.","Yes, plastic and organic waste separate, and the grey bin only once a month."],
    [0,"Eén keer per maand? Dat wordt puzzelen.","Once a month? That will be a puzzle."],
    [1,"Het went snel. Wij composteren nu ook zelf.","You get used to it quickly. We now compost ourselves too."],
    [0,"Echt? Misschien moeten wij dat ook proberen.","Really? Maybe we should try that too."],
    [1,"Ik laat je onze bak wel even zien.","I will show you our bin sometime."]]},

{id:"c24",u:"energy2",t:"Een thuisbatterij?",scene:"🔋🏠📉",set:"Client asks an adviser whether storage pays off.",
 sp:["Klant","Adviseur"],
 l:[[0,"Sinds de nieuwe regels lever ik veel stroom terug voor weinig geld. Is een thuisbatterij iets voor mij?","Since the new rules I feed back a lot of power for little money. Is a home battery something for me?"],
    [1,"Dat hangt van uw verbruik af. Wat is uw jaarverbruik?","That depends on your consumption. What is your annual use?"],
    [0,"Ongeveer vijfendertighonderd kilowattuur.","About thirty-five hundred kilowatt-hours."],
    [1,"Met een batterij verhoogt u het eigen verbruik van dertig naar zeventig procent.","With a battery you raise self-consumption from thirty to seventy percent."],
    [0,"En de terugverdientijd?","And the payback period?"],
    [1,"Bij de huidige prijzen ongeveer acht jaar. Ik maak een berekening met uw eigen gegevens.","At current prices about eight years. I will make a calculation with your own data."]]},

{id:"c25",u:"solar",t:"Storing in de omvormer",scene:"☀️⚠️🔧",set:"Technician and operator on a fault ticket.",
 sp:["Monteur","Beheerder"],

    [1,"Zie je vochtschade bij de connectoren?","Do you see moisture damage at the connectors?"],

    [1,"Goed. Draai daarna een isolatietest voordat je hem inschakelt.","Good. Run an insulation test afterwards before you switch it on."],
    [0,"Doe ik. Meting is nu boven de één megaohm. Ik schakel in.","Will do. Reading is now above one megaohm. Switching on."],
    [1,"Mooi, de opbrengst loopt weer. Sluit jij het ticket af?","Great, the yield is running again. Will you close the ticket?"]]},

{id:"c26",u:"market",t:"Bellen met de netbeheerder",scene:"🏛️🕸️📞",set:"Chasing a grid connection application.",
 sp:["Ontwikkelaar","Netbeheerder"],
 l:[[0,"Ik bel over onze aanvraag voor een grootverbruikaansluiting in Flevoland.","I am calling about our application for a large-consumer connection in Flevoland."],
    [1,"Een moment… uw aanvraag staat op de wachtlijst voor die regio.","One moment… your application is on the waiting list for that region."],
    [0,"Kunt u een indicatie geven van de doorlooptijd?","Can you give an indication of the lead time?"],
    [1,"Helaas niet. Er is daar sprake van netcongestie.","Unfortunately not. There is grid congestion there."],
    [0,"Zijn er mogelijkheden voor een flexibel transportcontract?","Are there options for a flexible transport contract?"],
    [1,"Dat kan. Ik stuur u vandaag de voorwaarden en het aanvraagformulier.","That is possible. I will send you the conditions and the application form today."]]},

{id:"c27",u:"project",t:"De weekstart",scene:"🗂️👥🗓️",set:"Three colleagues in a short project stand-up.",
 sp:["Projectleider","Emma","Daan"],
 l:[[0,"Goedemorgen allemaal. Emma, hoe staat het ontwerp ervoor?","Good morning everyone. Emma, how is the design coming along?"],

    [0,"Mooi. Daan, en de vergunning?","Good. Daan, and the permit?"],
    [2,"De gemeente heeft aanvullende vragen gesteld. Dat kost ons twee weken.","The municipality asked additional questions. That will cost us two weeks."],
