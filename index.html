    [2,"Eens. Ik zet de nieuwe datum in de actielijst.","Agreed. I will put the new date in the action list."]]},

{id:"c28",u:"business",t:"De offerte is te duur",scene:"📈🤝💶",set:"Negotiating a quote with a client.",
 sp:["Klant","Accountmanager"],
 l:[[0,"We vinden de offerte eerlijk gezegd te hoog.","Honestly, we find the quote too high."],
    [1,"Dat begrijp ik. Aan welk budget denkt u ongeveer?","I understand. What budget do you have in mind roughly?"],
    [0,"Zo'n tien procent lager.","About ten percent lower."],
    [1,"De prijs wordt vooral bepaald door de netaansluiting. Daar kunnen we weinig aan doen.","The price is mainly driven by the grid connection. We cannot do much about that."],
    [0,"En als we de oplevering in twee fases doen?","And if we do delivery in two phases?"],
    [1,"Dan komen we uit op ongeveer acht procent lager. Zal ik dat uitwerken?","Then we arrive at about eight percent lower. Shall I work that out?"],
    [0,"Graag. Stuur het voor vrijdag, dan beslissen we volgende week.","Please. Send it before Friday, then we will decide next week."]]},

{id:"c29",u:"debate",t:"Beleefd oneens",scene:"⚖️💬🤔",set:"Colleagues disagree about cutting the design budget.",
 sp:["Max","Sanne"],

    [1,"Ik begrijp je punt, maar ik zie het anders.","I understand your point, but I see it differently."],

{id:"c30",u:"society",t:"Gaan stemmen",scene:"🗳️🏛️🚲",set:"Two friends before local elections.",

const DAY = 864e5;

/* ---- storage with graceful fallback (Safari private mode, sandboxes) ---- */
const mem = {};
function storageOK() { try { localStorage.setItem('__t', '1'); localStorage.removeItem('__t'); return true; } catch (e) { return false; } }
const S = {
  // every operation tries the real store; memory is only a shadow for the
  // current page-life. One failed write must never silently disconnect the app.
  get(k, d) {
    try { const v = localStorage.getItem(k); if (v != null) return JSON.parse(v); } catch (e) { }
    try { const m = mem[k]; if (m != null) return JSON.parse(m); } catch (e) { }
    return d;
  },
  set(k, v) {
    let s; try { s = JSON.stringify(v); } catch (e) { return; }
    mem[k] = s;
    try { localStorage.setItem(k, s); }
    catch (e) { try { localStorage.setItem(k, s); } catch (e2) { } }  // one retry; shadow keeps this session alive
  },
  del(k) { delete mem[k]; try { localStorage.removeItem(k); } catch (e) { } }
};

/* ---- profiles ---- */
const PKEY = 'nl.profiles';
let PROFILES = S.get(PKEY, null);
if (!PROFILES) { PROFILES = []; S.set(PKEY, PROFILES); }
let ME = null;                       // active profile

/* ---- per-profile state ---- */
let ST = null;
const FRESH = () => ({
  start: today(),
  minutes: 30,             // daily target
  rate: 0.92,              // tts speed
  cards: {},               // wordId -> {b:box, d:dueMs, n:seen, c:correct, w:wrong}
  gram: {},                // grammarId -> {done:n, best:pct}
  lis: {},                 // listenId -> {done:n, best:pct}
  spk: {},                 // rolePlayId -> done count
  log: {},                 // date -> {m:minutes, n:new, r:reviews, x:xp}
  fav: [],
  chk: {},                 // level -> best checkpoint score (%)
  conv: {},                // conversationId -> times played
  utest: {},               // unitKey -> best unit-test score (%)
  partner: null,           // imported partner snapshot for side-by-side view
  seenIntro: 0
});
function loadState() {
  let st = S.get(key('state'), null);
  const bak = S.get(key('bak'), null);
  // self-healing: if the live state lost its cards but a backup still has them, restore
  if (bak && bak.cards && Object.keys(bak.cards).length &&
      (!st || !st.cards || Object.keys(st.cards).length < Object.keys(bak.cards).length / 2)) {
    st = bak;
    setTimeout(() => { try { toast('Restored your progress from the automatic backup 🛟'); } catch (e) { } }, 800);
  }
  ST = st || FRESH();
  for (const k in FRESH()) if (!(k in ST)) ST[k] = FRESH()[k];
  S.set(key('state'), ST);
}
function backupState() { try { S.set(key('bak'), ST); } catch (e) { } }
let saveT = null;
function save() { clearTimeout(saveT); saveT = setTimeout(() => { if (ME) S.set(key('state'), ST); }, 250); }
function saveNow() { clearTimeout(saveT); S.set(key('state'), ST); }

/* ---- vocab indexes ---- */
const W = VOCAB.words, UNITS = VOCAB.units;
const byId = {}; W.forEach(w => byId[w.id] = w);
const UNIT = {}; UNITS.forEach(u => UNIT[u.k] = u);
const byUnit = {}; W.forEach(w => (byUnit[w.u] = byUnit[w.u] || []).push(w));
const QUEUE = W.filter(w => UNIT[w.u].core);          // curriculum order
const LEVELS = ['A1', 'A2', 'B1', 'B2'];
const lvWords = {}; LEVELS.forEach(l => lvWords[l] = QUEUE.filter(w => w.lv === l));

/* ---- SRS ---- */
const IV = [10, 1440, 4320, 10080, 23040, 50400, 108000, 216000]; // minutes
const MAXB = IV.length - 1;
const card = id => ST.cards[id];
const isNew = id => !ST.cards[id];
const isDue = (id, now) => { const c = ST.cards[id]; return c && c.d <= now; };
function grade(id, ok) {
  let c = ST.cards[id];
  if (!c) c = ST.cards[id] = { b: 0, d: 0, n: 0, c: 0, w: 0 };
  c.n++;
  if (ok) { c.c++; c.b = Math.min(MAXB, c.b + 1); }
  else { c.w++; c.b = c.b <= 1 ? 0 : Math.max(1, c.b - 2); }
  const jitter = 0.9 + Math.random() * 0.2;
  c.d = Date.now() + IV[c.b] * 60000 * (c.b > 0 ? jitter : 1);
  save();
}
const learnedCount = () => Object.values(ST.cards).filter(c => c.b >= 3).length;
const startedCount = () => Object.keys(ST.cards).length;
function dueList(now) { return W.filter(w => isDue(w.id, now)).sort((a, b) => ST.cards[a.id].d - ST.cards[b.id].d); }
function nextNew(n) { const out = []; for (const w of QUEUE) { if (out.length >= n) break; if (isNew(w.id)) out.push(w); } return out; }

/* ---- level progress ---- */
function lvStat(l) {
  const ws = lvWords[l], tot = ws.length;
  let done = 0; ws.forEach(w => { const c = ST.cards[w.id]; if (c && c.b >= 3) done++; });
  return { tot, done, pct: tot ? done / tot : 0 };
}
function curLevel() {
  let cur = 'A0';
  for (const l of LEVELS) { const s = lvStat(l); if (s.pct >= 0.8) cur = l; else return { lv: l, pct: s.pct, done: s.done, tot: s.tot, prev: cur }; }
  return { lv: 'B2', pct: 1, done: lvStat('B2').done, tot: lvStat('B2').tot, prev: 'B1' };
}

/* ---- daily plan ---- */
function plan() {
  const m = ST.minutes;
  const nNew = m >= 45 ? 13 : m >= 40 ? 11 : 9;
  const nRev = m >= 45 ? 90 : 60;
  return { nNew, nRev, nListen: m >= 45 ? 2 : 1, nSpeak: m >= 45 ? 3 : 2, gram: m >= 45 || (dayIndex() % 2 === 0) };
}
const dayIndex = () => Math.floor((Date.now() - new Date(ST.start + 'T00:00:00').getTime()) / DAY);
function todayLog() { return ST.log[today()] || { m: 0, n: 0, r: 0, x: 0 }; }
function bump(f, v) { const t = today(); const l = ST.log[t] || (ST.log[t] = { m: 0, n: 0, r: 0, x: 0 }); l[f] = (l[f] || 0) + v; save(); }
function streak() {
  let s = 0, d = new Date();
  for (; ;) { const k = dstr(d); const l = ST.log[k]; if (l && (l.r + l.n) >= 5) { s++; d = new Date(d - DAY); } else if (k === today()) { d = new Date(d - DAY); } else break; }
  return s;
}
function doneToday() { const l = todayLog(); const p = plan(); return l.n >= p.nNew && l.r >= Math.min(p.nRev, dueList(Date.now()).length + l.r); }

/* ---- text to speech ---- */
let VOICE = null, VOICES = [], NLVOICES = [];
function pickVoice() {
  VOICES = speechSynthesis.getVoices() || [];
  const nl = VOICES.filter(v => /^nl/i.test(v.lang));
  const pref = S.get('nl.voice', '');
  const quality = v => (/enhanced|premium|verbeterd/i.test(v.name) ? 2 : 0) + (/nl-NL/i.test(v.lang) ? 1 : 0);
  NLVOICES = nl.slice().sort((a, b) => quality(b) - quality(a));
  VOICE = nl.find(v => v.name === pref) || NLVOICES[0] || null;
}
if (window.speechSynthesis) { pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }
let lastSpeak = 0;
setInterval(() => { try { if (window.speechSynthesis && speechSynthesis.speaking && speechSynthesis.paused) speechSynthesis.resume(); } catch (e) { } }, 700);
function say(text, opt) {
  opt = opt || {};
  if (!window.speechSynthesis) return;
  try {
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(String(text).replace(/_+/g, ' ').replace(/\u2082/g, '2').replace(/\u2026/g, ''));
    u.lang = opt.en ? 'en-US' : 'nl-NL';
    let v = VOICE;
    if (!opt.en && opt.sp != null && NLVOICES.length > 1) v = NLVOICES[opt.sp % NLVOICES.length]; // each character gets their own voice
    if (!opt.en && v) u.voice = v;
    u.rate = (opt.rate || (opt.en ? 1 : ST.rate)) * (opt.slow ? 0.62 : 1);
    u.pitch = (opt.sp === 1 ? 1.09 : opt.sp === 2 ? 1.04 : opt.sp === 0 ? 0.96 : 1) + (/\?\s*$/.test(String(text)) ? 0.05 : 0);
    if (opt.onend) u.onend = opt.onend;
    lastSpeak = Date.now();
    speechSynthesis.speak(u);
  } catch (e) { }
}
const hasNL = () => VOICES.some(v => /^nl/i.test(v.lang));

/* ---- text normalisation (typing check, search) ----
   NB: all speech-RECOGNITION code was removed deliberately (it froze iPhones in
   home-screen apps — see handoff §2/§6). Speaking = listen + say aloud + honest
   self-rate. Do not re-add SpeechRecognition, and do not gate any copy on it. */
function normalize(s) {
  return String(s).toLowerCase()
    .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
    .replace(/[^a-z0-9\s']/g, ' ').replace(/\s+/g, ' ').trim();
}

/* ======================= EXERCISE ENGINE ======================= */
const RUN = $('#run'), RTOP = RUN.querySelector('.top'), RBODY = RUN.querySelector('.body'), RFOOT = RUN.querySelector('.foot');
let sess = null;

function distractors(w, n, needEmoji) {
  let pool = (byUnit[w.u] || []).filter(x => x.id !== w.id && x.m !== w.m);
  if (needEmoji) pool = pool.filter(x => x.e && x.e !== w.e);
  if (pool.length < n) {
    let extra = W.filter(x => x.id !== w.id && x.m !== w.m && (!needEmoji || (x.e && x.e !== w.e)));
    pool = pool.concat(shuf(extra).slice(0, n * 3));
  }
  const out = [], used = new Set([w.m, w.e]);
  for (const c of shuf(pool)) {
    if (out.length >= n) break;
    if (used.has(c.m)) continue;
    if (needEmoji && used.has(c.e)) continue;
    used.add(c.m); if (c.e) used.add(c.e);
    out.push(c);
  }
  return out;
}

/* build one exercise object for a word */
function makeEx(w, forced) {
  const c = ST.cards[w.id], b = c ? c.b : -1;
  let type = forced;
  if (!type) {
    if (b < 0) type = 'intro';
    else if (b === 0) type = w.e ? 'pic' : 'nl2en';
    else if (b === 1) type = 'en2nl';
    else if (b === 2) type = 'listen';
    else if (b === 3) type = 'cloze';
    else type = rnd(['cloze', 'type', 'listen', 'en2nl']);
  }
  return { w, type };
}

/* ---------- renderers: each returns {html, wire(root, done)} ---------- */
const SEP_PREFIX = /^(achter|binnen|dicht|gerust|kapot|klaar|langs|samen|schoon|tegen|terug|thuis|uiteen|verder|open|over|rond|voor|goed|leeg|neer|vast|aan|door|mee|toe|uit|weg|af|in|na|om|op)(?=[a-z]{4,})/;
function stemForms(base, add) {
  // every surface form a Dutch -en verb can take in a sentence
  const st = base.slice(0, -2), vs = new Set([st]);
  if (/([bcdfgklmnprstz])\1$/.test(st)) vs.add(st.slice(0, -1)); // wassen → was
  const m = st.match(/^(.*?)([aeou])([bcdfgklmnprstvz])$/);
  if (m) vs.add(m[1] + m[2] + m[2] + m[3]);                       // koken → kook
  [...vs].forEach(v => { if (v.endsWith('v')) vs.add(v.slice(0, -1) + 'f'); if (v.endsWith('z')) vs.add(v.slice(0, -1) + 's'); });
  vs.forEach(v => { add(v); add(v + 't'); add(v + 'e'); add(v + 'te'); add(v + 'de'); });
}
const IRR = {
  zijn:['ben','bent','is','was','waren','geweest'], hebben:['heb','hebt','heeft','had','hadden','gehad'],
  gaan:['ga','gaat','ging','gingen','gegaan'], komen:['kom','komt','kwam','kwamen','gekomen'],
  doen:['doe','doet','deed','deden','gedaan'], zien:['zie','ziet','zag','zagen','gezien'],
  zeggen:['zeg','zegt','zei','zeiden','gezegd'], willen:['wil','wilt','wilde','wilden','gewild'],
  kunnen:['kan','kunt','kon','konden','gekund'], moeten:['moet','moest','moesten'],
  mogen:['mag','mocht','mochten'], zullen:['zal','zult','zou','zouden'],
  weten:['weet','wist','wisten','geweten'], eten:['eet','at','aten','gegeten'],
  staan:['sta','staat','stond','stonden','gestaan'], worden:['word','wordt','werd','werden','geworden'],
  blijven:['blijf','blijft','bleef','bleven','gebleven'], vinden:['vind','vindt','vond','vonden','gevonden'],
  krijgen:['krijg','krijgt','kreeg','kregen','gekregen'], kopen:['koop','koopt','kocht','kochten','gekocht'],
  brengen:['breng','brengt','bracht','brachten','gebracht'], denken:['denk','denkt','dacht','dachten','gedacht'],
  houden:['houd','houdt','hield','hielden','gehouden'], laten:['laat','liet','lieten','gelaten'],
  kijken:['kijk','kijkt','keek','keken','gekeken'], spreken:['spreek','spreekt','sprak','spraken','gesproken'],
  nemen:['neem','neemt','nam','namen','genomen'], geven:['geef','geeft','gaf','gaven','gegeven'],
  lezen:['lees','leest','las','lazen','gelezen'], schrijven:['schrijf','schrijft','schreef','schreven','geschreven'],
  slapen:['slaap','slaapt','sliep','sliepen','geslapen'], vertrekken:['vertrek','vertrekt','vertrok','vertrokken'],
  beginnen:['begin','begint','begon','begonnen'], drinken:['drink','drinkt','dronk','dronken','gedronken'],
  helpen:['help','helpt','hielp','hielpen','geholpen'], lopen:['loop','loopt','liep','liepen','gelopen'],
  rijden:['rijd','rijdt','reed','reden','gereden'], vliegen:['vlieg','vliegt','vloog','vlogen','gevlogen'],
  winnen:['win','wint','won','wonnen','gewonnen'], verliezen:['verlies','verliest','verloor','verloren'],
  zoeken:['zoek','zoekt','zocht','zochten','gezocht'], heten:['heet','heette','geheten'], zitten:['zit','zat','zaten','gezeten'],
  liggen:['lig','ligt','lag','lagen','gelegen'], vragen:['vraag','vraagt','vroeg','vroegen','gevraagd']
};
function segForms(base) {
  const out = new Set(); const add = x => { if (x && x.length > 1) out.add(x); };
  out.add(base);                                  // even one-letter words ('u') match their exact token
  if (IRR[base]) IRR[base].forEach(add);
  add(base); add(base + 't'); add(base + 'e'); add(base + 'te'); add(base + 'de'); add(base + 'd'); add(base + 'en'); add(base + 'n'); add(base + 's');
  const verbStems = b => {
    if (b.endsWith('en')) stemForms(b, add);
    else if (b.endsWith('n')) { add(b.slice(0, -1)); add(b.slice(0, -1) + 't'); add(b.slice(0, -2)); } // staan → sta, staat
  };
  if (base.endsWith('n')) {
    verbStems(base);
    const sp = base.match(SEP_PREFIX);
    if (sp) { const rest = base.slice(sp[1].length); add(rest); verbStems(rest); }   // opstaan → sta … op
    [...out].forEach(f => { if (f.length > 3 && !f.startsWith('ge')) { add('ge' + f + 'd'); add('ge' + f); } }); // participles: geannuleerd
  }
  const um = base.match(/^(.*?)(aa|ee|oo|uu)([bcdfgklmnprstvz])$/);
  if (um) add(um[1] + um[2][0] + um[3] + 'en');                   // graad → graden
  if (base.endsWith('f')) add(base.slice(0, -1) + 'ven');         // brief → brieven
  if (base.endsWith('s')) add(base.slice(0, -1) + 'zen');         // huis → huizen
  return out;
}
function clozeSegs(word) {
  // segments of the phrase, longest first, each with its surface forms
  return word.split('/')[0].toLowerCase().split(' ')
    .map(x => x.replace(/[^a-zà-ÿ]/g, '')).filter(Boolean)
    .sort((a, b) => b.length - a.length).map(segForms);
}
function clozeForms(word) {
  const u = new Set(); clozeSegs(word).forEach(fs => fs.forEach(f => u.add(f)));
  return u;
}
function formMatch(clean, forms) {
  if (forms.has(clean)) return true;
  for (const f of forms) {
    if (clean.length > f.length && f.length >= 3 && (clean.endsWith(f) || clean.startsWith(f))) return true;   // appelsap, kipfilet
    if (f.length > clean.length && clean.length >= 4 && (f.endsWith(clean) || f.startsWith(clean))) return true; // huurauto → huur
    const L = Math.min(clean.length, f.length);
    if (L >= 6) { let i = 0; while (i < L && clean[i] === f[i]) i++; if (i >= L - 2) return true; }             // laadcyclus → laadcycli
  }

}

  const toks = sent.split(/(\s+)/);

    for (let i = 0; i < toks.length; i++) {
      const clean = toks[i].toLowerCase().replace(/[^a-zà-ÿ]/g, '');
      if (clean && formMatch(clean, forms)) {
        const parts = toks.slice(); parts[i] = toks[i].replace(/[a-zà-ÿA-ZÀ-ß']+/, '<u>&nbsp;</u>');
        return parts.join('');

    }
  }
  return null;
}

    };
  },

  cloze(w) {
    // blank the target word inside its own example sentence,
    // aware of Dutch stem changes: koken→kook, geven→geef, graad→graden, sap→appelsap
    const gap = clozeGap(w.w, w.nl);
    if (!gap) return EX.en2nl(w);
    const opts = shuf([w, ...distractors(w, 3)]);
    return {
      html: `<div class="prompt"><div class="eyebrow">complete the sentence</div></div>
        <div class="cloze">${gap}</div>
        <div class="sm" style="text-align:center">${esc(w.en)}</div>
        <div class="opts">${opts.map(o => `<button class="opt" data-id="${o.id}"><span class="ot nl">${esc(o.w)}</span></button>`).join('')}</div>`,
      wire: mcqWire(w)
    };
  },

  type(w) {
    const hint = w.w.length > 3 ? w.w.slice(0, 1) + '·'.repeat(w.w.length - 1) : '';
    return {
      html: `<div class="prompt"><div class="eyebrow">type it in dutch</div>
        ${wIcon(w)}
        <div class="big en" style="margin-top:6px">${esc(w.m)}</div>
        <div class="sub num">${esc(hint)}</div></div>
        <input class="typebox" id="tb" autocomplete="off" autocorrect="off" autocapitalize="none" spellcheck="false" placeholder="…">`,
      foot: `<button class="btn" id="chk">Check</button>`,
      auto: () => { const t = $('#tb'); if (t) t.focus(); },
      wire(root, done) {
        const tb = $('#tb'), btn = $('#chk');
        const go = () => {
          const ok = normalize(tb.value) === normalize(w.w) ||
            normalize(tb.value) === normalize(w.w.replace(/^(de|het)\s+/, ''));
          tb.classList.add(ok ? 'ok' : 'no'); tb.blur(); tb.disabled = true;
          showReveal(root, w, ok, ok ? '' : 'You typed: ' + (tb.value || '—'));
          done(ok);
        };
        btn.onclick = go;
        tb.onkeydown = e => { if (e.key === 'Enter') go(); };
      }
    };
  }
};

function mcqWire(w) {
  return function (root, done) {
    const btns = [...root.querySelectorAll('.opt')];
    btns.forEach(b => b.onclick = () => {
      if (root.dataset.answered) return;
      root.dataset.answered = '1';
      const ok = +b.dataset.id === w.id;
      btns.forEach(x => {
        if (+x.dataset.id === w.id) x.classList.add('ok');
        else if (x === b) x.classList.add('no');
        else x.classList.add('dim');
        x.style.pointerEvents = 'none';
      });
      showReveal(root, w, ok);
      done(ok);
    });
  };
}

function showReveal(root, w, ok, extra) {
  haptic(ok);
  const d = el('div', 'reveal');
  d.innerHTML = `<div class="fb ${ok ? 'ok' : 'no'}">${ok ? '✓ Correct' : '✗ Not quite'}</div>

/* ======================= SESSION RUNNER ======================= */
function closeRun() { RUN.style.display = 'none'; document.body.style.overflow = ''; }
function startSession(items, title, opts) {
  opts = opts || {};
  items = (items || []).filter(Boolean);
  if (!items.length) { toast('Nothing to practise here yet'); return; }
  sess = { items, i: 0, ok: 0, t0: Date.now(), title, counted: opts.counted !== false, onEnd: opts.onEnd };
  RUN.style.display = 'flex';
  document.body.style.overflow = 'hidden';
  safeStep();   // never step() unguarded: a throw here would leave a blank, scroll-locked overlay
}
function confetti() {
  const box = el('div', 'confetti'); document.body.appendChild(box);
  const cols = ['#FFB020', '#5B8DEF', '#34D399', '#FF6B6B', '#E7ECF5'];
  for (let i = 0; i < 60; i++) {
    const c = document.createElement('i');
    c.style.left = Math.random() * 100 + 'vw';
    c.style.background = cols[i % cols.length];
    c.style.animationDelay = (Math.random() * .7) + 's';
    c.style.animationDuration = (2 + Math.random() * 1.4) + 's';
    box.appendChild(c);
  }
  setTimeout(() => box.remove(), 4200);
}

function endSession() {
  const mins = Math.round((Date.now() - sess.t0) / 60000);
  if (sess.counted && mins > 0) bump('m', mins);
  saveNow(); backupState();
  const total = sess.items.length, ok = sess.ok, s = sess;
  RTOP.innerHTML = ''; RFOOT.innerHTML = `<button class="btn" id="fin">Done</button>`;
  const pct2 = Math.round(ok / Math.max(1, total) * 100);
  const praise = pct2 >= 90 ? 'Kanjer! 🚀' : pct2 >= 75 ? 'Lekker bezig! 🧡' : pct2 >= 50 ? 'Goed gedaan! 🌷' : 'Doorzetten — morgen makkelijker! 💪';
  if (pct2 >= 75) confetti();
  RBODY.innerHTML = `<div style="flex:1;display:flex;flex-direction:column;justify-content:center;text-align:center">
      <div class="scorering" style="--p:${pct2}"><b>${pct2}%</b></div>
      <div class="h1" style="margin-top:10px">${praise}</div>
      <div class="sm" style="margin-top:6px">${esc(s.title)} · ${ok}/${total} correct · ${mins} min · <span class="streak" style="display:inline-block">🔥</span> ${streak()}-day streak</div>
      <div class="card" style="margin-top:24px;text-align:left">
        <div class="eyebrow">next up</div>
        <div class="sm" style="margin-top:6px;color:var(--tx)">${esc(nextHint())}</div>
      </div>
    </div>`;
  $('#fin').onclick = () => {
    closeRun();
    try { if (s.onEnd) s.onEnd(s.ok, total); } catch (e) { console.error('onEnd:', e); }
    render();
  };
}
function nextHint() {
  const due = dueList(Date.now() + DAY).length;
  const cl = curLevel();
  if (cl.lv === 'B2' && cl.pct >= 1) return 'You have covered the whole B2 word list. Keep reviewing and switch your practice to listening and speaking.';
  return `${due} words come back for review within 24 hours. You are ${Math.round(cl.pct * 100)}% through ${cl.lv}.`;
}

function safeStep() {
  if (!sess) return;
  try { step(); }
  catch (e) {
    console.error('step:', e);
    sess.i++;
    if (sess.i < sess.items.length) { setTimeout(safeStep, 0); return; }
    // last card failed: still land the user somewhere sane rather than a dead screen
    try { endSession(); }
    catch (e2) { console.error('endSession:', e2); saveNow(); closeRun(); toast('That session ended early — your progress is saved'); render(); }
  }
}
function step() {
  if (sess.i >= sess.items.length) return endSession();
  const it = sess.items[sess.i];
  const ex = typeof it === 'function' ? it() : it;
  const total = sess.items.length, pct = sess.i / total;

  RTOP.innerHTML = `<button class="icob" id="xq">✕</button>
    <div class="bar grow"><i style="width:${(pct * 100).toFixed(1)}%"></i></div>
    <div class="num xs">${sess.i + 1}/${total}</div>`;
  $('#xq').onclick = () => {
    if (sess.i > 0) { const m = Math.round((Date.now() - sess.t0) / 60000); if (sess.counted && m > 0) bump('m', m); }
    saveNow(); backupState(); closeRun(); render();
  };

  RBODY.innerHTML = ''; RBODY.dataset.answered = ''; RBODY.dataset.w = ex.w ? ex.w.id : '';
  const wrap = el('div', 'grow'); wrap.innerHTML = ex.html; RBODY.appendChild(wrap);
  RBODY.scrollTop = 0;
  RFOOT.innerHTML = ex.foot || '';

  let advanced = false;
  const advance = (ok, isIntro) => {
    if (advanced) return;           // one answer per card, however fast the taps
    advanced = true;
    if (ok) sess.ok++;
    if (ex.w && !ex.noGrade) {
      if (isIntro) {
        if (!ST.cards[ex.w.id]) ST.cards[ex.w.id] = { b: 0, d: Date.now() + IV[0] * 60000, n: 0, c: 0, w: 0 };
        bump('n', 1);
        const l2 = todayLog(); (l2.ni = l2.ni || []).push(ex.w.id); save();
      } else { grade(ex.w.id, ok); bump('r', 1); }
      bump('x', ok ? 3 : 1);
    }
    if (ex.gdrill) { const s = ST.gram[ex.g.id] || (ST.gram[ex.g.id] = { done: 0, ok: 0, n: 0 }); s.n++; if (ok) s.ok++; save(); }
    if (ex.listenq) { const s = ST.lis[ex.p.id] || (ST.lis[ex.p.id] = { n: 0, ok: 0 }); s.n++; if (ok) s.ok++; save(); }
    if (ex.lastListen && sess.counted) bump('l', 1);
    if (ex.gdrill && sess.counted && ex.i === ex.g.d.length - 1) bump('g', 1);
    if (ex.speak) { if (sess.counted) bump('s', 1); sess.i++; setTimeout(safeStep, 260); }
    else if (isIntro) { sess.i++; setTimeout(safeStep, 0); }
    else {
      RFOOT.innerHTML = `<button class="btn" id="nx">Continue</button>`;
      $('#nx').onclick = () => { sess.i++; safeStep(); };
    }
  };

  if (ex.wire) ex.wire(RBODY, advance);
  if (ex.foot && !ex.wire) {
    const nb = RFOOT.querySelector('[data-next]');
    if (nb) nb.onclick = () => { sess.i++; step(); };
  }
  if (ex.auto) setTimeout(ex.auto, 120);
}

/* ---------- build today's session ---------- */
function buildDaily() {
  const p = plan(), now = Date.now(), items = [];
  const lg = todayLog();

  // 1. reviews first (warm-up)
  const due = dueList(now).slice(0, Math.max(0, p.nRev - lg.r));
  const firstHalf = due.slice(0, Math.ceil(due.length * 0.5));
  const rest = due.slice(firstHalf.length);
  firstHalf.forEach(w => items.push(makeExLazy(w)));

  // 2. new words: intro + immediate check
  const fresh = nextNew(Math.max(0, p.nNew - lg.n));
  fresh.forEach(w => { items.push(EX.intro(w)); items.push(makeExLazy(w, w.e ? 'pic' : 'nl2en')); });

  // 3. remaining reviews
  rest.forEach(w => items.push(makeExLazy(w)));

  // 4. grammar
  if (p.gram && !(lg.g > 0)) {
    const g = nextGrammar();
    if (g) { items.push(grammarBlock(g)); g.d.forEach((_, i) => items.push(grammarDrill(g, i))); }
  }

  // 5. listening — starts as single words, grows into passages as you do
  const listenLeft = Math.max(0, p.nListen - (lg.l || 0));
  const heard = Object.keys(ST.cards).length + fresh.length;
  if (heard < 120) {
    // early days: hear ONE word, pick it from four — nothing longer
    const pool = listenLeft ? shuf([...fresh, ...startedWords()]).slice(0, 4) : [];
    pool.forEach((w, i) => { const it = makeExLazy(w, 'listen'); if (i === pool.length - 1) items.push(() => Object.assign(it(), { lastListen: true })); else items.push(it); });
  } else {
    const lp = pickPassages(listenLeft);
    lp.forEach(pa => pa.q.forEach((_, i) => { const e2 = passageEx(pa, i); if (i === pa.q.length - 1) e2.lastListen = true; items.push(e2); }));
  }

  // 6. speaking — sentences from words met today, else from learned pool
  const speakLeft = Math.max(0, p.nSpeak - (lg.s || 0));
  const spool = (fresh.length ? fresh : shuf(startedWords()).slice(0, 6));
  shuf(spool).slice(0, speakLeft).forEach(w => items.push(speakEx(w.nl, w.en, 'speaking · ' + w.w)));

  return items;
}
function makeExLazy(w, forced) { return () => { const e = makeEx(w, forced); const r = EX[e.type](w); r.w = w; return r; }; }
function startedWords() { return QUEUE.filter(w => ST.cards[w.id]); }
function nextGrammar() {
  const cl = curLevel().lv;
  const order = { A1: 0, A2: 1, B1: 2, B2: 3 };
  const avail = GRAMMAR.filter(g => order[g.lv] <= order[cl] + (curLevel().pct > .4 ? 1 : 0));
  const un = avail.find(g => !ST.gram[g.id]);
  if (un) return un;
  const weak = avail.filter(g => { const s = ST.gram[g.id]; return s && s.n && s.ok / s.n < .8; });
  return weak.length ? rnd(weak) : rnd(avail.length ? avail : GRAMMAR);
}
function pickPassages(n) {
  const cl = curLevel().lv, order = { A1: 0, A2: 1, B1: 2, B2: 3 };
  let pool = LISTEN.filter(p => order[p.lv] <= order[cl]);
  if (pool.length < n) pool = LISTEN.slice(0, 6);
  const un = pool.filter(p => !ST.lis[p.id]);
  // shortest unheard passages first: difficulty grows with you
  const pick = (un.length >= n ? un : shuf(pool)).sort((x, y) => x.nl.length - y.nl.length).slice(0, n);
  return pick;
}

}

/* ---- the journey: a winding road A0 → B2, one stop per unit ---- */
function unitProg(u) {
  const ws = W.filter(x => x.u === u.k);
  let started = 0, learned = 0;
  ws.forEach(x => { const c = ST.cards[x.id]; if (c) { started++; if (c.b >= 3) learned++; } });
  return { tot: ws.length, started, learned, pct: ws.length ? learned / ws.length : 0 };
}
function roadmap() {
  const units = VOCAB.units.filter(u => u.core).sort((a, b) => a.o - b.o);
  const GAP = 84, PAD = 46, Wd = 320;
  const H = PAD * 2 + GAP * (units.length - 1);
  const pt = i => [Wd / 2 + Math.sin(i * 1.05) * 92, PAD + i * GAP];
  let activeIdx = units.length - 1;
  const prog = units.map(unitProg);
  for (let i = 0; i < units.length; i++) if (prog[i].pct < .8) { activeIdx = i; break; }

  let segs = '', stops = '', flags = '', lastLv = '';
  for (let i = 0; i < units.length; i++) {
    const [x, y] = pt(i);
    if (i) {
      const [px, py] = pt(i - 1), mx = (px + x) / 2;
      const doneSeg = i <= activeIdx && prog[i - 1].pct >= .8;
      segs += `<path d="M${px} ${py} C ${px} ${py + GAP * .5}, ${x} ${y - GAP * .5}, ${x} ${y}" fill="none"
        stroke="${doneSeg ? 'var(--amber)' : 'var(--line2)'}" stroke-width="${doneSeg ? 5 : 4}"
        stroke-linecap="round" ${doneSeg ? '' : 'stroke-dasharray="1 9"'} />`;
    }
    if (u_lv(units[i]) !== lastLv) {
      lastLv = u_lv(units[i]);
      flags += `<div class="rflag lv ${lastLv}" style="top:${y - 34}px">${lastLv}</div>`;
    }
    const st = i < activeIdx ? 'done' : i === activeIdx ? 'act' : 'todo';
    stops += `<button class="rstop ${st}" data-unit="${units[i].k}" style="left:${x - 25}px;top:${y - 25}px">
        <span class="ri">${units[i].i}</span>
        ${st === 'done' ? '<span class="rok">✓</span>' : ''}
        ${st === 'act' ? `<span class="rme">${esc(ME.name[0].toUpperCase())}</span>` : ''}
      </button>
      ${st !== 'todo' ? `<div class="rpct num" style="left:${x - 25}px;top:${y + 27}px">${Math.round(prog[i].pct * 100)}%</div>` : ''}`;
  }
  const ahead = paceDelta();
  return `<div class="sec"><div class="between"><div class="eyebrow">your road to B2</div>
      <span class="xs num" style="color:${ahead >= 0 ? 'var(--mint)' : 'var(--coral)'}">${ahead >= 0 ? '+' + ahead : ahead} days vs the 12-month plan</span></div></div>
    <div class="card" style="padding:0;overflow:hidden">
      <div id="roadwrap" style="height:330px;overflow-y:auto;-webkit-overflow-scrolling:touch">
        <div id="road" style="position:relative;width:${Wd}px;margin:0 auto;height:${H}px">
          <svg width="${Wd}" height="${H}" style="position:absolute;inset:0">${segs}</svg>
          ${flags}${stops}
          <div class="rflag" style="top:${H - 20}px;color:var(--amber)">🏁 B2</div>
        </div>
      </div>
    </div>`;
}
function u_lv(u) { return u.lv; }
function paceDelta() {
  const total = QUEUE.length, learnedNow = Object.keys(ST.cards).length;
  const target = Math.min(total, Math.round(total * Math.min(1, (dayIndex() + 1) / 365)));
  return Math.round((learnedNow - target) / (total / 365));
}

function pace() {
  // 12-month target curve vs actual learned words
  const total = QUEUE.length, days = 365;
  const start = new Date(ST.start + 'T00:00:00').getTime();
  const W_ = 100, H = 62;
  let pts = [], maxD = 0;
  const dayKeys = Object.keys(ST.log).sort();
  let cum = 0, byDay = {};
  // reconstruct cumulative learned from card count only (approximate by log of new words)
  dayKeys.forEach(k => { cum += ST.log[k].n; byDay[k] = cum; });
  const di = Math.max(0, dayIndex());
  for (let d = 0; d <= di; d++) {
    const k = dstr(start + d * DAY);
    const v = byDay[k] != null ? byDay[k] : (d ? pts[pts.length - 1][1] : 0);
    pts.push([d, v]); maxD = d;
  }
  if (!pts.length) pts = [[0, 0]];
  const sx = d => (d / days) * W_, sy = v => H - (v / total) * H;
  const line = pts.map(p => `${sx(p[0]).toFixed(2)},${sy(p[1]).toFixed(2)}`).join(' ');
  const area = `0,${H} ` + line + ` ${sx(maxD).toFixed(2)},${H}`;
  const actual = pts[pts.length - 1][1];
  const target = Math.round(total * (di + 1) / days);
  const diff = actual - target;
  const eta = actual > 0 && di > 0 ? Math.round((total - actual) / (actual / (di + 1))) : null;

  return `<div class="card">
    <div class="between" style="margin-bottom:8px">
      <div><div class="eyebrow">pace to B2</div>
        <div class="h3" style="margin-top:4px">${actual} of ${total} words introduced</div></div>
      <span class="chip ${diff >= 0 ? 'mint' : 'amber'}">${diff >= 0 ? '+' : ''}${diff} vs plan</span>
    </div>
    <svg class="curve" viewBox="0 0 ${W_} ${H}" preserveAspectRatio="none">
      <defs><linearGradient id="pg" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="rgba(255,176,32,.30)"/><stop offset="100%" stop-color="rgba(255,176,32,0)"/>
      </linearGradient></defs>
      <line class="grid" x1="0" y1="${H}" x2="${W_}" y2="${H}"/>
      <line class="grid" x1="0" y1="${(H / 2).toFixed(1)}" x2="${W_}" y2="${(H / 2).toFixed(1)}"/>
      <polyline class="target" points="0,${H} ${W_},0"/>
      <polygon class="fill" points="${area}"/>
      <polyline class="act" points="${line}"/>
    </svg>
    <div class="between xs" style="margin-top:2px"><span>start</span><span>month 6</span><span>month 12</span></div>
    <div class="sm" style="margin-top:8px">${eta && eta > 0 && actual > 20
      ? `At your current rate you finish the word list in about <b class="num">${eta}</b> more days.`
      : 'Keep going for a few days and a pace estimate will appear here.'}</div>
  </div>`;
}

function unitTest(k) {
  const ws = byUnit[k];
  const seen = ws.filter(w => ST.cards[w.id]);
  const pool = shuf(seen.length >= 12 ? seen : ws);
  const kinds = ['nl2en', 'en2nl', 'cloze', 'listen'];
  const items = pool.slice(0, 12).map((w, i) => () => {
    const ex = EX[kinds[i % kinds.length]](w);
    ex.noGrade = true;
    return ex;
  });
  startSession(items, UNIT[k].n + ' · test', {
    counted: false,
    onEnd(score, total) {
      const pct = Math.round(score / Math.max(1, total) * 100);
      ST.utest = ST.utest || {}; ST.utest[k] = Math.max(ST.utest[k] || 0, pct); saveNow();
      toast(pct >= 80 ? 'Passed: ' + pct + '%' : pct + '% — review this unit and try again');
    }
  });
}

            <span class="cven">${esc(ln[2])}</span>
          </button>
        </div>`).join('')}
    </div>`;
  RFOOT.innerHTML = `<div class="row" style="gap:8px;width:100%">
      <button class="icob" id="cvprev">⏮</button>
      <button class="btn grow" id="cvgo">▶ Play</button>
      <button class="icob" id="cvslow" title="slow mode">🐢</button>
      <button class="icob" id="cvnext">⏭</button>
    </div>`;

  const lines = [...RBODY.querySelectorAll('.cvline')];
  const btn = $('#cvgo');
  function paint() {
    lines.forEach((el, k) => {
      el.classList.toggle('on', k === i);
      el.classList.toggle('seen', k < i);
    });
    if (i >= 0 && lines[i]) try { lines[i].scrollIntoView({ block: 'center', behavior: 'smooth' }); } catch (e) { }
  }
  function speakLine(k, then) {
    const ln = c.l[k];
    if (myRole !== null && ln[0] === myRole && then) {
      // your line: the app stays silent and waits for you to say it out loud
      btn.textContent = '✓ I said it — continue';
      btn.onclick = () => { btn.onclick = toggle; btn.textContent = '❚❚ Pause'; then(); };
      return;
    }
    const est = Math.max(1400, 550 + ln[1].length * (slowMode ? 100 : 62)) / (ST.rate || 1);
    let done = false;
    const fin = () => { if (!done) { done = true; then && then(); } };
    say(ln[1], { onend: fin, slow: slowMode, sp: ln[0] });
    cvT = setTimeout(fin, est + 250);   // TTS onend is unreliable on iOS; never let the player hang
  }
  function step() {
    if (!playing) return;
    i++;
    if (i >= c.l.length) return finish();
    paint();
    speakLine(i, () => { clearTimeout(cvT); cvT = setTimeout(step, 650); });   // breathing room, like a real exchange
  }
  function finish() {
    playing = false; i = c.l.length; paint();
    ST.conv = ST.conv || {}; ST.conv[c.id] = (ST.conv[c.id] || 0) + 1; saveNow();
    btn.textContent = '↻ Replay';
    render();  // refresh the list's play-count behind the overlay
  }
  function toggle() {
    if (playing) { playing = false; convStop(); btn.textContent = '▶ Play'; return; }
    if (i >= c.l.length || i < 0) i = -1;
    else i--;                            // resume on the current line
    playing = true; btn.textContent = '❚❚ Pause';
    convStop(); step();
  }
  function jump(k) {
    convStop(); playing = false; btn.textContent = '▶ Play';
    i = k; paint(); speakLine(k);
  }
  btn.onclick = toggle;
  RBODY.querySelectorAll('[data-role]').forEach(ch => ch.onclick = () => {
    const r = +ch.dataset.role;
    myRole = myRole === r ? null : r;
    RBODY.querySelectorAll('[data-role]').forEach(x => x.style.outline = '');
    if (myRole !== null) { ch.style.outline = '2px solid currentColor'; $('#rolehint').textContent = 'You are ' + c.sp[myRole] + ' — your lines wait for your voice'; }
    else $('#rolehint').textContent = 'Tap a name to speak that role yourself';
  });
  $('#cvslow').onclick = () => { slowMode = !slowMode; $('#cvslow').style.background = slowMode ? 'var(--amber)' : ''; toast(slowMode ? 'Slow mode on 🐢' : 'Normal speed'); };
  $('#cvprev').onclick = () => jump(Math.max(0, (i < 0 ? 0 : i) - 1));
  $('#cvnext').onclick = () => { if (i >= c.l.length - 1) return; jump((i < 0 ? -1 : i) + 1); };
  lines.forEach((el, k) => el.onclick = () => jump(k));
  $('#xq').onclick = () => { convStop(); RUN.style.display = 'none'; document.body.style.overflow = ''; render(); };
  toggle();                              // autoplay on open
}

function numberDrill() {
  const items = [];
  const words = ['nul', 'een', 'twee', 'drie', 'vier', 'vijf', 'zes', 'zeven', 'acht', 'negen', 'tien', 'elf', 'twaalf', 'dertien', 'veertien', 'vijftien', 'zestien', 'zeventien', 'achttien', 'negentien'];
  const tens = ['', '', 'twintig', 'dertig', 'veertig', 'vijftig', 'zestig', 'zeventig', 'tachtig', 'negentig'];
  const spell = n => {
    if (n < 20) return words[n];
    const t = Math.floor(n / 10), u = n % 10;
    if (!u) return tens[t];
    return words[u] + (/e$/.test(words[u]) ? 'ën' : 'en') + tens[t];
  };
  const timeStr = (h, m) => {
    // real spoken Dutch pivots around the half hour from :20 to :40
    const nx = h % 12 + 1;
    if (m === 0) return `${spell(h)} uur`;
    if (m === 15) return `kwart over ${spell(h)}`;
    if (m === 30) return `half ${spell(nx)}`;
    if (m === 45) return `kwart voor ${spell(nx)}`;
    if (m < 20) return `${spell(m)} over ${spell(h)}`;
    if (m < 30) return `${spell(30 - m)} voor half ${spell(nx)}`;
    if (m < 45) return `${spell(m - 30)} over half ${spell(nx)}`;
    return `${spell(60 - m)} voor ${spell(nx)}`;
  };
  for (let i = 0; i < 6; i++) {
    const n = Math.floor(Math.random() * 89) + 11;
    const opts = shuf([n, n + 10, +(String(n).split('').reverse().join('')), n + 1].filter((v, ix, a) => a.indexOf(v) === ix).slice(0, 4));
    items.push(audioMCQ(spell(n), 'Which number?', opts.map(o => ({ t: String(o), ok: o === n }))));
  }
  for (let i = 0; i < 4; i++) {
    const h = Math.floor(Math.random() * 11) + 1, m = rnd([0, 15, 30, 45, 5, 10, 20, 25, 35, 40, 50]);
    const shown = `${h}:${String(m).padStart(2, '0')}`;
    const wrong = [`${h}:${String((m + 30) % 60).padStart(2, '0')}`, `${h % 12 + 1}:${String(m).padStart(2, '0')}`, `${h}:${String((m + 15) % 60).padStart(2, '0')}`];
    items.push(audioMCQ(`Het is ${timeStr(h, m)}.`, 'What time is it?', shuf([{ t: shown, ok: true }, ...wrong.map(t => ({ t, ok: false }))])));
  }
  for (let i = 0; i < 4; i++) {
    const e = Math.floor(Math.random() * 90) + 5, c = rnd([0, 25, 50, 95, 99]);
    const txt = c ? `${spell(e)} euro ${spell(c)}` : `${spell(e)} euro`;
    const shown = `€${e},${String(c).padStart(2, '0')}`;
    const wrong = [`€${e + 10},${String(c).padStart(2, '0')}`, `€${e},${String((c + 5) % 100).padStart(2, '0')}`, `€${Math.max(1, e - 20)},${String(c).padStart(2, '0')}`];
    items.push(audioMCQ(txt, 'What is the price?', shuf([{ t: shown, ok: true }, ...wrong.map(t => ({ t, ok: false }))])));
  }
  startSession(shuf(items), 'Numbers & times');
}
function audioMCQ(nl, q, opts) {
  return {
    html: `<div class="prompt"><div class="eyebrow">listen</div>
      <div style="margin:18px 0"><button class="icob" data-say="${esc(nl)}" style="width:78px;height:78px;font-size:30px;margin:0 auto">🔊</button></div>
      <div class="h3">${esc(q)}</div></div>
      <div class="opts">${opts.map(o => `<button class="opt" data-ok="${o.ok ? 1 : 0}"><span class="ot num" style="font-size:20px">${esc(o.t)}</span></button>`).join('')}</div>`,
    auto: () => setTimeout(() => say(nl), 250),
    wire(root, done) {
      const btns = [...root.querySelectorAll('.opt')];
      btns.forEach(b => b.onclick = () => {
        if (root.dataset.answered) return; root.dataset.answered = '1';
        const ok = b.dataset.ok === '1';
        btns.forEach(x => { x.classList.add(x.dataset.ok === '1' ? 'ok' : (x === b ? 'no' : 'dim')); x.style.pointerEvents = 'none'; });

        done(ok);
      });
    }
  };
}
function dictation() {
  const pool = startedWords().filter(w => w.nl.split(' ').length > 3);
  if (pool.length < 5) return toast('Learn a few more words first');
  const items = shuf(pool).slice(0, 10).map(w => () => {
    const words = w.nl.replace(/[.?!]$/, '').split(' ');
    const forms = clozeForms(w.w);
    const gi = words.findIndex(x => formMatch(x.toLowerCase().replace(/[^a-z\u00e0-\u00ff]/g, ''), forms));
    const idx = gi >= 0 ? gi : Math.floor(words.length / 2);
    const answer = words[idx].replace(/[.,!?]/g, '');
    const shown = words.map((x, i) => i === idx ? '<u>&nbsp;</u>' : esc(x)).join(' ');
    return {
      html: `<div class="prompt"><div class="eyebrow">listen and fill the gap</div>
        <div style="margin:16px 0"><button class="icob" data-say="${esc(w.nl)}" style="width:74px;height:74px;font-size:28px;margin:0 auto">🔊</button></div></div>
        <div class="cloze">${shown}</div>
        <input class="typebox" id="tb" autocomplete="off" autocorrect="off" autocapitalize="none" spellcheck="false" placeholder="…" style="margin-top:14px">`,
      foot: `<button class="btn" id="chk">Check</button>`,
      auto: () => setTimeout(() => say(w.nl), 300),
      wire(root, done) {
        const tb = $('#tb');
        $('#chk').onclick = () => {
          const ok = normalize(tb.value) === normalize(answer);
          tb.classList.add(ok ? 'ok' : 'no'); tb.disabled = true; tb.blur();
          haptic(ok);
          root.appendChild(el('div', 'reveal', `<div class="fb ${ok ? 'ok' : 'no'}">${ok ? '✓ Correct' : '✗ It was: ' + esc(answer)}</div>
            <div class="rs">${esc(w.nl)}</div><div class="rt">${esc(w.en)}</div>`));
          done(ok);
        };
      }
    };
  });
  startSession(items, 'Dictation');
}

/* ---- level checkpoint exam: 16 word questions + 4 grammar drills, scored,
   and deliberately without SRS side-effects: an exam measures, it must not reschedule ---- */
function levelCheck(lv) {
  const pool = shuf(startedWords().filter(w => w.lv === lv));
  if (pool.length < 12) return toast('Learn a few more ' + lv + ' words first');
  const kinds = ['nl2en', 'en2nl', 'cloze', 'listen'];
  const items = pool.slice(0, 16).map((w, i) => () => {
    const ex = EX[kinds[i % kinds.length]](w);
    ex.noGrade = true;
    return ex;
  });
  shuf(GRAMMAR.filter(g => g.lv === lv)).slice(0, 4).forEach(g => {
    const di = Math.floor(Math.random() * g.d.length);
    items.push(() => grammarDrill(g, di));
  });
  startSession(shuf(items), lv + ' checkpoint', {
    counted: false,
    onEnd(score, total) {
      const pct = Math.round(score / Math.max(1, total) * 100);
      ST.chk = ST.chk || {}; ST.chk[lv] = Math.max(ST.chk[lv] || 0, pct); saveNow();
      toast(pct >= 80 ? lv + ' checkpoint passed: ' + pct + '%' : lv + ' checkpoint: ' + pct + '% — keep reviewing and retest');
    }
  });
}

/* ------------------------------ wiring ------------------------------ */
function wire() {
  const v = $('#view');
  const on = (sel, fn) => v.querySelectorAll(sel).forEach(b => b.onclick = () => fn(b));
  // Null-safe handle. wire() binds handlers with plain assignments, so ONE missing
  // element used to throw and leave every later handler on that tab unbound — the
  // whole tab went dead and looked like a crash. A stand-in keeps the rest wired.
  const qEl = sel => $(sel) || (console.warn('wire: missing ' + sel), el('button'));

  if (TAB === 'today') {
    qEl('#go').onclick = () => {
      const items = buildDaily();
      if (!items.length) return extraMenu();
      startSession(items, 'Session');
    };
    qEl('#gcard').onclick = () => { const g = nextGrammar(); startSession([grammarBlock(g), ...g.d.map((_, i) => grammarDrill(g, i))], g.t); };
    qEl('#qw').onclick = () => {
      const due = dueList(Date.now()); const pool = due.length ? due : shuf(startedWords());
      if (!pool.length) return toast('Start your first session');
      startSession(shuf(pool).slice(0, 10).map(w => makeExLazy(w)), 'Quick 10');
    };
    qEl('#ql').onclick = () => { TAB = 'listen'; render(); };
    qEl('#qs').onclick = () => { TAB = 'speak'; render(); };
    on('.rstop', b => { TAB = 'words'; openUnit = b.dataset.unit; render(); });
    on('[data-cv]', b => convPlay(b.dataset.cv));
    scrollRoad();
  }

  if (TAB === 'words') {
    if (openUnit) {
      qEl('#back').onclick = () => { openUnit = null; render(); };
      qEl('#pu').onclick = () => {
        const ws = byUnit[openUnit];
        const seen = ws.filter(w => ST.cards[w.id]);
        const pick = seen.length >= 8 ? shuf(seen).slice(0, 15) : shuf(ws).slice(0, 12);
        startSession(pick.map(w => ST.cards[w.id] ? makeExLazy(w) : EX.intro(w)), UNIT[openUnit].n);
      };
      qEl('#pl').onclick = () => startSession(shuf(byUnit[openUnit]).slice(0, 15).map(w => makeExLazy(w, 'listen')), UNIT[openUnit].n + ' · ear');
      qEl('#ut').onclick = () => unitTest(openUnit);
      const fq = qEl('#fq');
      fq.oninput = () => {
        const q = normalize(fq.value);
        qEl('#wl').querySelectorAll('[data-s]').forEach(r => r.style.display = !q || r.dataset.s.includes(q) ? '' : 'none');
      };
      on('[data-w]', b => wordSheet(+b.dataset.w));
      on('[data-cv]', b => convPlay(b.dataset.cv));
    } else on('[data-unit]', b => { openUnit = b.dataset.unit; qEl('#view').scrollTop = 0; render(); });
  }

  if (TAB === 'listen') {
    on('[data-cv]', b => convPlay(b.dataset.cv));
    qEl('#dnum').onclick = numberDrill;
    qEl('#ddic').onclick = dictation;
    qEl('#dwrd').onclick = wordEar;
    on('[data-lp]', b => {
      const p = LISTEN.find(x => x.id === b.dataset.lp);
      startSession(p.q.map((_, i) => passageEx(p, i)), p.t);
    });
  }

  if (TAB === 'speak') {
    qEl('#shadow').onclick = shadowing;
    on('[data-snd]', b => soundSheet(b.dataset.snd));
    on('[data-rp]', b => rolePlay(b.dataset.rp));
  }

  if (TAB === 'you') {
    qEl('#switch').onclick = () => { saveNow(); clearTimeout(saveT); ME = null; boot(); };
    on('[data-min]', b => { ST.minutes = +b.dataset.min; saveNow(); render(); });
    on('[data-rate]', b => { ST.rate = +b.dataset.rate; saveNow(); render(); say('Goedemorgen, hoe gaat het met je?'); });
    on('[data-voice]', b => { S.set('nl.voice', b.dataset.voice); pickVoice(); render(); say('Goedemorgen, hoe gaat het met je?'); });
    on('[data-g]', b => { const g = GRAMMAR.find(x => x.id === b.dataset.g); startSession([grammarBlock(g), ...g.d.map((_, i) => grammarDrill(g, i))], g.t, { counted: false }); });
    on('[data-chk]', b => levelCheck(b.dataset.chk));
    qEl('#test').onclick = () => say('Goedemorgen! Ik werk in de energiesector, met zonnepanelen en batterijen.');
    const invgo = qEl('#invgo');
    if (invgo) invgo.onclick = () => {
      const name = qEl('#invn').value.trim(), email = qEl('#inve').value.trim();
      if (!name || !/.+@.+\..+/.test(email)) return toast('A name and a valid email, please');
      const code = sendInvite(name, email);
      const inv = S.get('nl.invites', []).filter(x => x.email.toLowerCase() !== email.toLowerCase());
      inv.push({ name, email, code, date: today() });
      S.set('nl.invites', inv); render();
    };
    v.querySelectorAll('[data-reinv]').forEach(b => b.onclick = () => {
      const x = S.get('nl.invites', []).find(i => i.email === b.dataset.reinv);
      if (x) sendInvite(x.name, x.email);
    });
    qEl('#pshare').onclick = async () => {
      const snap = mySnapshot();
      const txt = JSON.stringify(snap);
      const fname = 'voortgang-' + ME.name.toLowerCase().replace(/\W+/g, '') + '.json';
      const file = new File([txt], fname, { type: 'application/json' });
      if (navigator.share && navigator.canShare && navigator.canShare({ files: [file] })) {
        try { await navigator.share({ files: [file], title: 'Mijn Nederlands-voortgang' }); return; } catch (e) { }
      }
      const blob = new Blob([txt], { type: 'application/json' });
      const link = el('a'); link.href = URL.createObjectURL(blob); link.download = fname;
      document.body.appendChild(link); link.click(); link.remove();
      toast('Saved — send the file to your partner');
    };
    qEl('#pimp').onclick = () => qEl('#pimpf').click();
    qEl('#pimpf').onchange = e => {
      const f = e.target.files[0]; if (!f) return;
      const r = new FileReader();
      r.onload = () => {
        try {
          const d = JSON.parse(r.result);
          if (d.kind !== 'nl-progress' || !d.lv) throw 0;
          if (d.name === ME.name) return toast("That is your own snapshot — import your partner's");
          ST.partner = d; saveNow(); toast(d.name + "'s progress imported"); render();
        } catch (err) { toast('That file is not a progress snapshot'); }
      };
      r.readAsText(f);
    };
    qEl('#exp').onclick = () => {
      const blob = new Blob([JSON.stringify({ v: 1, name: ME.name, state: ST }, null, 1)], { type: 'application/json' });
      const a = el('a'); a.href = URL.createObjectURL(blob);
      a.download = 'dutch-' + ME.name.toLowerCase().replace(/\W+/g, '') + '-' + today() + '.json';
      document.body.appendChild(a); a.click(); a.remove();
    };
    qEl('#imp').onclick = () => qEl('#impf').click();
    qEl('#impf').onchange = e => {
      const f = e.target.files[0]; if (!f) return;
      const r = new FileReader();
      r.onload = () => {
        try {
          const d = JSON.parse(r.result);
          if (!d.state || !d.state.cards) throw 0;
          ST = d.state; for (const k in FRESH()) if (!(k in ST)) ST[k] = FRESH()[k];
          saveNow(); toast('Progress restored'); render();
        } catch (err) { toast('That file could not be read'); }
      };
      r.readAsText(f);
    };
    qEl('#reset').onclick = () => {
      sheet(`<div class="h2">Reset everything?</div>
        <p class="sm">This wipes ${esc(ME.name)}'s words, streak and grammar scores. It cannot be undone.</p>
        <button class="btn danger" id="ry" style="margin-top:12px">Yes, reset</button>
        <button class="btn line" id="rn" style="margin-top:8px">Cancel</button>`);
      qEl('#ry').onclick = () => { ST = FRESH(); saveNow(); closeSheet(); render(); toast('Reset done'); };
      qEl('#rn').onclick = closeSheet;
    };
  }
}

/* ---- invitations: the owner mints codes; a code unlocks a new profile ---- */
function accessCode(email) {
  // self-validating code: the app can check it on any phone without a server
  const t = (email || '').trim().toLowerCase() + '·nl-b2·volendam';
  let h1 = 2166136261, h2 = 5381;
  for (let i = 0; i < t.length; i++) {
    h1 = (h1 ^ t.charCodeAt(i)) * 16777619 >>> 0;
    h2 = ((h2 << 5) + h2 + t.charCodeAt(i)) >>> 0;
  }
  return (h1.toString(36) + h2.toString(36)).toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, 6);
}

  const g = $('#gate');
  g.innerHTML = `<h1 class="h1">Join with your invitation</h1>

      <div class="sm" style="margin-top:4px">Words return exactly when you are about to forget them: 10 minutes, 1 day, 3 days, a week, then months. Missing days is what costs you, not a bad answer.</div>
    </div>
    <div class="card" style="background:var(--panel2)">
      <div class="h3">3 · Say everything out loud</div>
      <div class="sm" style="margin-top:4px">Even when the app doesn't ask. Silent learners understand Dutch but freeze when the baker asks a question.</div>
    </div>
    <div class="note">Before your first session, check the Dutch voice under <b>You → Test the Dutch voice</b>. If it sounds English, install a Dutch voice in iPhone Settings.</div>
    <button class="btn" style="margin-top:16px" id="okgo">Start day 1</button>`);
  $('#okgo').onclick = closeSheet;
}
